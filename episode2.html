var PAL = {

function setSeed(s) { G.seed = s >>> 0; }

function fnv1a(str) {
  var h = 0x811C9DC5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}

var SPR = {};

  var c = document.createElement('canvas');

// ============================================================================
// 3. WEB AUDIO SYNTHESIZER (4-VOICE POLYPHONY)
// ============================================================================
var AU = {
  ctx: null,
  master: null,
  muted: false,
  activeVoice: 'piano',
  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.16;
      this.master.connect(this.ctx.destination);
    } catch (e) {}
  },
  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playNote: function (freq, dur, type, gainVal) {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(gainVal || 0.18, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + dur);
  },
  playModem: function () {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc1 = this.ctx.createOscillator();
    var osc2 = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(1200, now);
    osc2.type = 'square';   osc2.frequency.setValueAtTime(2400, now);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc1.connect(g); osc2.connect(g);
    g.connect(this.master);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.35); osc2.stop(now + 0.35);
  },
  playThump: function () {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(g); g.connect(this.master);
    osc.start(now); osc.stop(now + 0.25);
  }
};

// ============================================================================
// 5. 4D PNEUMATIC ROUTER PUZZLE & SOLVER
// ============================================================================
// Pipe routing model: sides are bitmask N=1 E=2 S=4 W=8. Each cell type has a
// base opening mask; rotation rotates the mask clockwise. The capsule enters
// cell (0,0) through its West side and must exit cell (4,3) through its East
// side having passed through BOTH wormholes — the puzzle's "4 dimensions" are
// the search state (x, y, w31-visited, w47-visited).
var DIRBIT = { N: 1, E: 2, S: 4, W: 8 };
var DELTA = { 1: [0, -1], 2: [1, 0], 4: [0, 1], 8: [-1, 0] };
var OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };
function rotMaskCW(m, r) {
  for (var i = 0; i < r; i++) m = ((m << 1) & 0xF) | ((m >> 3) & 1);
  return m;
}
var BASE_MASK = { 1: 5, 2: 3, 3: 7, 4: 15, wormhole31: 15, wormhole47: 15 };

var PUZZLE = {
  active: false,
  status: 'IDLE',
  grid: [],
  cursor: { x: 0, y: 0 },
  deliveredAt: null,
  START: { x: 0, y: 0, from: 8 },
  GOAL: { x: 4, y: 3, out: 2 },
  init: function () {
    this.grid = [];
    for (var y = 0; y < 4; y++) {
      var row = [];
      for (var x = 0; x < 5; x++) {
        var isW31 = (x === 2 && y === 1);
        var isW47 = (x === 3 && y === 2);
        row.push({
          type: isW31 ? 'wormhole31' : (isW47 ? 'wormhole47' : ((x + y) % 4 + 1)),
          rot: (x + y) % 4
        });
      }
      this.grid.push(row);
    }
    this.status = 'IDLE';
    this.deliveredAt = null;
  },
  mask: function (cell) { return rotMaskCW(BASE_MASK[cell.type], cell.rot); },
  rotate: function (x, y) {
    if (this.grid[y] && this.grid[y][x]) {
      this.grid[y][x].rot = (this.grid[y][x].rot + 1) % 4;
      this.status = 'IDLE';
    }
  },
  trace: function () {
    var seen = {}, q = [], g = this.grid, s0 = this.START;
    if (!(this.mask(g[s0.y][s0.x]) & s0.from)) return { delivered: false };
    q.push({ x: s0.x, y: s0.y, from: s0.from, w31: false, w47: false });
    while (q.length) {
      var st = q.shift();
      var key = st.x + ',' + st.y + ',' + st.from + ',' + st.w31 + ',' + st.w47;
      if (seen[key]) continue;
      seen[key] = true;
      var m = this.mask(g[st.y][st.x]);
      for (var d = 1; d <= 8; d <<= 1) {
        if (d === st.from || !(m & d)) continue;
        if (st.x === this.GOAL.x && st.y === this.GOAL.y && d === this.GOAL.out) {
          if (st.w31 && st.w47) return { delivered: true };
          continue;
        }
        var nx = st.x + DELTA[d][0], ny = st.y + DELTA[d][1];
        if (nx < 0 || nx > 4 || ny < 0 || ny > 3) continue;
        if (!(this.mask(g[ny][nx]) & OPP[d])) continue;
        q.push({ x: nx, y: ny, from: OPP[d],
                 w31: st.w31 || (nx === 2 && ny === 1),
                 w47: st.w47 || (nx === 3 && ny === 2) });
      }
    }
    return { delivered: false };
  },
  isSolved: function () { return this.trace().delivered; },
  // BFS over (x, y, entrySide, w31, w47): each expansion picks a rotation of
  // the entered cell whose mask opens the entry side, then exits through every
  // other open side. The parent chain yields the rotation assignment, which is
  // then applied and verified by a full trace().
  solve: function () {
    var s0 = this.START, goal = this.GOAL;
    var q = [{ x: s0.x, y: s0.y, from: s0.from, w31: false, w47: false, rot: null, parent: null }];
    var seen = {}, hit = null;
    while (q.length && !hit) {
      var st = q.shift();
      var baseKey = st.x + ',' + st.y + ',' + st.from + ',' + st.w31 + ',' + st.w47;
      if (seen[baseKey]) continue;
      seen[baseKey] = true;
      var type = this.grid[st.y][st.x].type;
      for (var r = 0; r < 4 && !hit; r++) {
        var m = rotMaskCW(BASE_MASK[type], r);
        if (!(m & st.from)) continue;
        for (var d = 1; d <= 8; d <<= 1) {
          if (d === st.from || !(m & d)) continue;
          var withRot = { x: st.x, y: st.y, from: st.from, w31: st.w31, w47: st.w47,
                          rot: r, parent: st.parent };
          if (st.x === goal.x && st.y === goal.y && d === goal.out && st.w31 && st.w47) {
            hit = withRot;
            break;
          }
          var nx = st.x + DELTA[d][0], ny = st.y + DELTA[d][1];
          if (nx < 0 || nx > 4 || ny < 0 || ny > 3) continue;
          q.push({ x: nx, y: ny, from: OPP[d],
                   w31: withRot.w31 || (nx === 2 && ny === 1),
                   w47: withRot.w47 || (nx === 3 && ny === 2),
                   rot: null, parent: withRot });
        }
      }
    }
    if (!hit) return false;
    var cur = hit;
    while (cur) {
      if (cur.rot !== null) this.grid[cur.y][cur.x].rot = cur.rot;
      cur = cur.parent;
    }
    this.status = 'IDLE';
    return this.trace().delivered;
  },
  dispatch: function () {
    AU.playThump();
    if (this.trace().delivered) {
      G.flags.puzzle_tube_cleared = true;
      this.status = 'DELIVERED';
      this.deliveredAt = G.frame;
    } else {
      this.status = 'DEADLOCK';
    }
  }
};

function startDialogue(id) {
  if (!SCRIPT.nodes[id]) return;
  G.dialogue = {
    nodeId: id,
    stepIdx: 0,
    waiting: false,
    choosing: false,
    choiceSel: 0
  };
}

function stepDialogue() {
  if (!G.dialogue) return;
  var d = G.dialogue;
  var node = SCRIPT.nodes[d.nodeId];
  if (!node) { G.dialogue = null; return; }

  if (d.stepIdx >= node.steps.length) {
    if (d.nodeId === 'deep_vault.singularity.end' || d.nodeId === 'credits.end') {
      G.flags.ep2_cliffhanger = true;
    }
    if (d.nodeId === 'tube_hub.puzzle.open') {
      G.dialogue = null;
      PUZZLE.active = true;
      PUZZLE.cursor = { x: 0, y: 0 };
      return;
    }
    if (node.end) {
      if (d.nodeId === 'roof12.to_hub') {
        enterScene('tube_hub', 15, 10);
        startDialogue('tube_hub.start');
        return;
      }
      if (d.nodeId === 'tube_hub.to_mem31') {
        enterScene('mem31', 10, 10);
        startDialogue('mem31.start');
        return;
      }
      if (d.nodeId === 'mem31.to_mem47') {
        enterScene('mem47', 10, 10);
        startDialogue('mem47.start');
        return;
      }
      if (d.nodeId === 'mem47.to_deep_vault') {
        enterScene('deep_vault', 15, 10);
        startDialogue('deep_vault.start');
        return;
      }
      G.dialogue = null;
      return;
    }
    if (node.next) {
      startDialogue(node.next);
      return;
    }
    G.dialogue = null;
    return;
  }

  var step = node.steps[d.stepIdx];
  if (step.say) {
    d.waiting = true;
    G._drawn = { who: step.say[0], text: step.say[1] };
    G._twCount = 0;
  } else if (step.choice) {
    d.choosing = true;
    d.choiceSel = 0;
    G._drawnChoices = { sel: 0, labels: step.choice.map(function(c){return c[0];}) };
  }
}

function advanceDialogue() {
  if (!G.dialogue) return;
  var d = G.dialogue;
  if (d.choosing) return;
  d.stepIdx++;
  d.waiting = false;
  stepDialogue();
}

function humanAdvance() {
  var d = G.dialogue;
  if (!d || !d.waiting) return;
  if (G._drawn && G._twCount < G._drawn.text.length) { G._twCount = G._drawn.text.length; return; }
  advanceDialogue();
}

function chooseOption(idx) {
  if (!G.dialogue || !G.dialogue.choosing) return;
  var d = G.dialogue;
  var node = SCRIPT.nodes[d.nodeId];
  var step = node.steps[d.stepIdx];
  var nextNode = step.choice[idx] ? step.choice[idx][1] : node.next;
  d.choosing = false;
  if (d.nodeId === 'deep_vault.bibix.talk' && idx === 1) {
    if (G.mementos.indexOf('check_256') < 0) G.mementos.push('check_256');
  }
  if (nextNode) startDialogue(nextNode);
  else { d.stepIdx++; stepDialogue(); }
}

}

function loadSlot(n) {

    G.flags = data.flags; G.banks = data.banks;
    G.mementos = data.mementos; G.era = data.era;

  } catch (e) { return false; }
}

function menuKey(e) {
  if (e.key === 'ArrowUp' || e.key === 'w') { if (G._saveSel > 1) G._saveSel--; return; }
  if (e.key === 'ArrowDown') { if (G._saveSel < 3) G._saveSel++; return; }
  if (e.key === 'Enter') {
    var okS = saveSlot(G._saveSel);
    G._menuMsg = okS ? ('SLOT ' + G._saveSel + ' 저장 완료') : '저장 실패';
    if (okS) G._slotMeta[G._saveSel - 1] = G.scene;
    return;
  }
  if (e.key === 'l' || e.key === 'L') {
    var okL = loadSlot(G._saveSel);
    G._menuMsg = okL ? ('SLOT ' + G._saveSel + ' 불러오기 완료') : '빈 슬롯';
    if (okL) G._saveMenu = false;
    return;
  }
  if (e.key === 'm' || e.key === 'M' || e.key === 'Escape') G._saveMenu = false;
}

function puzzleKey(e) {
  var c = PUZZLE.cursor;
  if (e.key === 'ArrowLeft' || e.key === 'a') { if (c.x > 0) c.x--; return; }
  if (e.key === 'ArrowRight' || e.key === 'd') { if (c.x < 4) c.x++; return; }
  if (e.key === 'ArrowUp' || e.key === 'w') { if (c.y > 0) c.y--; return; }
  if (e.key === 'ArrowDown' || e.key === 's') { if (c.y < 3) c.y++; return; }
  if (e.key === 'e' || e.key === ' ') { if (!e.repeat) PUZZLE.rotate(c.x, c.y); return; }
  if (e.key === 'Enter') { if (!e.repeat) PUZZLE.dispatch(); return; }
  if (e.key === 'Escape') PUZZLE.active = false;
}

window.addEventListener('keydown', function (e) {
  AU.init(); AU.resume();
  if (G._title) { if (!e.repeat) dismissTitle(false); return; }
  if (G._saveMenu) { menuKey(e); return; }
  if (PUZZLE.active) { puzzleKey(e); return; }
  if (e.key === 'Shift') live.run = true;
  if (e.key === 'ArrowLeft' || e.key === 'a') live.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') live.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w') {
    live.up = true;
    if (G.dialogue && G.dialogue.choosing && G.dialogue.choiceSel > 0) G.dialogue.choiceSel--;
  }
  if (e.key === 'ArrowDown' || e.key === 's') {
    live.down = true;
    if (G.dialogue && G.dialogue.choosing) {
      var nodeC = SCRIPT.nodes[G.dialogue.nodeId];
      var stepC = nodeC.steps[G.dialogue.stepIdx];
      var maxSel = (stepC && stepC.choice) ? stepC.choice.length - 1 : 0;
      if (G.dialogue.choiceSel < maxSel) G.dialogue.choiceSel++;
    }
  }
  if (e.key === 'e' || e.key === ' ' || e.key === 'Enter') {
    if (!e.repeat) {
      if (G.dialogue && G.dialogue.choosing) chooseOption(G.dialogue.choiceSel);
      else if (G.dialogue && G.dialogue.waiting) humanAdvance();
      else interactScene();
    }
  }
  if (e.key === 'm' || e.key === 'M' || e.key === 'Escape') openSaveMenu();
});

window.addEventListener('keyup', function (e) {
  if (e.key === 'Shift') live.run = false;
  if (e.key === 'ArrowLeft' || e.key === 'a') live.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') live.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w') live.up = false;
  if (e.key === 'ArrowDown' || e.key === 's') live.down = false;
});

function interactObject(o) {
  var node = (G._visited[o.id] && o.node2) ? o.node2 : o.node;
  G._visited[o.id] = true;
  if (node) startDialogue(node);
}

function interactScene() {
  var objs = sceneDef().objects || [];
  for (var i = 0; i < objs.length; i++) {
    var o = objs[i];
    if (Math.abs(G.pos.x - o.x) <= 2 && Math.abs(G.pos.y - o.y) <= 2) {
      interactObject(o);
      return;
    }
  }
}

// ============================================================================
// 9. UPDATE LOOP & FIXED 1/60s TIMESTEP
// ============================================================================
function update() {
  G.frame++;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    G.flags.reducedMotion = true;
  }
  if (G.dialogue && !G.dialogue.waiting && !G.dialogue.choosing) {
    stepDialogue();
  }
  if (G.ffMode && G.dialogue && G.dialogue.waiting) {
    advanceDialogue();
  }
  if (G.dialogue && G.dialogue.waiting && G._drawn) {
    G._twCount = Math.min(G._drawn.text.length, G._twCount + 2);
  }
  if (G._fade > 0) G._fade--;
  if (G._sceneToast > 0) G._sceneToast--;
  if (PUZZLE.active && PUZZLE.status === 'DELIVERED' &&
      PUZZLE.deliveredAt !== null && G.frame - PUZZLE.deliveredAt >= 24) {
    PUZZLE.active = false;
    PUZZLE.deliveredAt = null;
    startDialogue('tube_hub.puzzle.cleared');
  }

  // Handle Input Queue (Bot/API)
  if (G.inputQ.length > 0) {
    var op = G.inputQ.shift();
    if (op.move) {
      if (op.move === 'R') G.pos.x += 1;
      if (op.move === 'L') G.pos.x -= 1;
      if (op.move === 'U') G.pos.y -= 1;
      if (op.move === 'D') G.pos.y += 1;
    }
    if (op.interact) {
      if (G.dialogue && G.dialogue.waiting) advanceDialogue();
      else interactScene();
    }
    if (op.choose !== undefined) chooseOption(op.choose);
  }

  // Live movement (blocked while any modal layer is up)
  var px0 = G.pos.x, py0 = G.pos.y;
  var modal = G._title || G._saveMenu || PUZZLE.active || !!G.dialogue;
  if (!modal) {
    var speed = live.run ? 300 : 150; // px/sec
    var dist = speed / 60 / 16;       // tiles per frame
    if (live.right) { G.pos.x += dist; G.dir = 'R'; }
    if (live.left)  { G.pos.x -= dist; G.dir = 'L'; }
    if (live.down)  { G.pos.y += dist; G.dir = 'D'; }
    if (live.up)    { G.pos.y -= dist; G.dir = 'U'; }
    var def = sceneDef();
    if (G.pos.x < 1) G.pos.x = 1;
    if (G.pos.x > def.w - 2) G.pos.x = def.w - 2;
    if (G.pos.y < 1) G.pos.y = 1;
    if (G.pos.y > def.h - 2) G.pos.y = def.h - 2;
  }
  G._moved = (G.pos.x !== px0 || G.pos.y !== py0);
  if (G._moved) {
    G._trail.push({ x: px0, y: py0 });
    if (G._trail.length > 14) G._trail.shift();
  }

  // Background BGM: phrase with rests + soft bass drone (no metronome)
  if (!AU.muted) {
    if (G.frame % 24 === 0) {
      var seq = MELODY[AU.activeVoice] || MELODY.piano;
      var freq = seq[Math.floor(G.frame / 24) % 16];
      if (freq) {
        if (AU.activeVoice === 'harpsichord') AU.playNote(freq * 2, 0.18, 'sawtooth', 0.06);
        else if (AU.activeVoice === 'pipe_organ') AU.playNote(freq, 1.1, 'square', 0.07);
        else AU.playNote(freq, 0.5, 'triangle', 0.07);
      }
    }
    if (G.frame % 192 === 0) AU.playNote(55, 1.6, 'sine', 0.05);
  }
}

  if (G.scene !== 'roof12' || G.flags.reducedMotion) return [];
  var out = [];
  for (var i = 0; i < 20; i++) {
    out.push({ x: (G.frame * 4 + i * 27) % 440 + 20, y: (i * 13 + G.frame) % 230 + 20 });
  }
  return out;
}

// Per-scene decorative set dressing (render-only, deterministic)
function drawSceneProps() {
  var f = G.frame;
  if (G.scene === 'roof12') {
    for (var i = 0; i < 26; i++) {
      var sx = 24 + (i * 67) % 432, sy = 24 + (i * 41) % 90;
      ctx.fillStyle = ((i + (f >> 5)) % 7 === 0) ? 'rgba(232,226,208,0.9)' : 'rgba(232,226,208,0.35)';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.fillStyle = '#D8D2C0';
    ctx.beginPath(); ctx.arc(404, 52, 13, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#1B2430';
    ctx.beginPath(); ctx.arc(398, 48, 11, 0, 6.3); ctx.fill();
    ctx.fillStyle = PAL.steel;
    for (var r = 0; r < 27; r++) ctx.fillRect(24 + r * 16, 244, 2, 8);
    ctx.fillRect(20, 242, 440, 2);
  } else if (G.scene === 'tube_hub') {
    for (var pIdx = 0; pIdx < 3; pIdx++) {
      var pyv = 32 + pIdx * 12;
      ctx.fillStyle = pIdx === 1 ? PAL.copper : PAL.brass;
      ctx.fillRect(20, pyv, 440, 6);
      ctx.fillStyle = PAL.shadow;
      for (var j = 0; j < 11; j++) ctx.fillRect(30 + j * 40, pyv + 1, 3, 4);
    }
    ctx.fillStyle = (f % 90 < 45) ? PAL.teal : '#1B3238';
    ctx.fillRect(150, 74, 10, 10);
    ctx.fillStyle = (f % 90 >= 45) ? PAL.rust : '#3A1F1A';
    ctx.fillRect(320, 74, 10, 10);
    ctx.fillStyle = PAL.paper;
    ctx.font = '8px monospace';
    ctx.fillText('W31', 148, 96); ctx.fillText('W47', 318, 96);
  } else if (G.scene === 'mem31') {
    ctx.strokeStyle = PAL.copper;
    ctx.lineWidth = 2;
    for (var c = 0; c < 5; c++) {
      ctx.beginPath();
      ctx.moveTo(52 + c * 88, 20);
      ctx.quadraticCurveTo(80 + c * 88, 56 + (c % 2) * 8, 108 + c * 88, 20);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.fillStyle = PAL.paper;
    ctx.fillRect(408, 60, 28, 34);
    ctx.fillStyle = PAL.rust;
    ctx.fillRect(408, 60, 28, 8);
    ctx.fillStyle = PAL.ink;
    ctx.font = '8px monospace';
    ctx.fillText('1995', 411, 84);
  } else if (G.scene === 'mem47') {
    ctx.fillStyle = '#26261F';
    for (var s2 = 0; s2 < 9; s2++) {
      var bx = 40 + s2 * 48;
      ctx.beginPath();
      ctx.moveTo(bx, 20); ctx.lineTo(bx + 10, 20); ctx.lineTo(bx + 5, 44 + (s2 % 3) * 8);
      ctx.fill();
    }
    for (var gI = 0; gI < 4; gI++) {
      ctx.fillStyle = 'rgba(127, 212, 168, ' + (0.10 + 0.05 * ((gI + (f >> 4)) % 2)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(90 + gI * 110, 190, 22, 0, 6.3); ctx.fill();
    }
  } else if (G.scene === 'deep_vault') {
    for (var b2 = 0; b2 < 24; b2++) {
      ctx.fillStyle = [PAL.rust, PAL.teal, PAL.olive, PAL.amber][b2 % 4];
      ctx.fillRect(28 + b2 * 18, 26, 12, 22);
    }
    ctx.fillStyle = PAL.brass;
    ctx.fillRect(20, 50, 440, 3);
    ctx.fillStyle = 'rgba(232,226,208,0.25)';
    for (var dM = 0; dM < 10; dM++) {
      ctx.fillRect(40 + (dM * 47) % 420, 70 + ((dM * 31) + (f >> 3)) % 150, 2, 2);
    }
  }
}

function render() {
  ctx.fillStyle = PAL.night;
  ctx.fillRect(0, 0, 480, 270);

  // Draw Scene Tiles (two-tone checker floor + wall band)
  var def = sceneDef();
  var floorA = G.scene === 'roof12' ? '#1B2430' : (G.scene === 'mem31' ? '#2E4A52' : '#1A1A18');
  var floorB = G.scene === 'roof12' ? '#202A38' : (G.scene === 'mem31' ? '#33525B' : '#20201D');
  ctx.fillStyle = floorA;
  ctx.fillRect(20, 20, 440, 230);
  for (var ty = 0; ty < 14; ty++) {
    for (var tx = 0; tx < 27; tx++) {
      if ((tx + ty) % 2 === 1) {
        ctx.fillStyle = floorB;
        ctx.fillRect(24 + tx * 16, 22 + ty * 16, 16, 16);
      }
    }
  }
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(20, 20, 440, 8);

  drawSceneProps();

  // Draw Wind Particles (shared source with api.windParticles)
  var wind = windParticles();
  if (wind.length) {
    ctx.fillStyle = 'rgba(232, 226, 208, 0.4)';
    for (var i = 0; i < wind.length; i++) ctx.fillRect(wind[i].x, wind[i].y, 6, 1);
  }

  // Draw Scene Objects
  (def.objects || []).forEach(function (o) {
    var sprImg = SPR[o.spr];
    if (sprImg) {
      ctx.drawImage(sprImg, o.x * 16, o.y * 16);
    } else {
      ctx.fillStyle = PAL.brass;
      ctx.fillRect(o.x * 16, o.y * 16, 24, 24);
    }
    if (!G.dialogue && !G._title && !G._saveMenu && !PUZZLE.active &&
        Math.abs(G.pos.x - o.x) <= 2 && Math.abs(G.pos.y - o.y) <= 2) {
      ctx.fillStyle = PAL.gold;
      ctx.font = 'bold 10px monospace';
      ctx.fillText('[E]', o.x * 16 + 6, o.y * 16 - 6);
    }
  });

  // Draw Bibix Hologram CRT Glitch
  if (G.scene === 'deep_vault') {
    ctx.fillStyle = 'rgba(127, 212, 168, 0.25)';
    ctx.fillRect(15 * 16 - 10, 8 * 16 - 20, 44, 50);
    ctx.fillStyle = PAL.crt;
    ctx.fillText('BIBIX [HOLO]', 15 * 16 - 15, 8 * 16 - 24);
  }

  // Draw Party: newbie trails the lead by 14 frames; both walk-animate
  var walkSuffix = (G._moved && Math.floor(G.frame / 8) % 2 === 1) ? '_b' : '_a';
  var np = G._trail.length ? G._trail[0] : { x: G.pos.x - 1.4, y: G.pos.y };
  drawActor('newbie_mech' + walkSuffix, np.x, np.y, G.dir === 'L');
  drawActor('kkos_coat' + walkSuffix, G.pos.x, G.pos.y, G.dir === 'L');

  // Draw 4D Pneumatic Router Puzzle Overlay
  if (PUZZLE.active) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.96)';
    ctx.fillRect(90, 20, 300, 230);
    ctx.strokeStyle = PAL.brass;
    ctx.lineWidth = 2;
    ctx.strokeRect(90, 20, 300, 230);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('『4D PNEUMATIC ROUTER [5x4 VALVES]』', 105, 40);
    for (var py = 0; py < 4; py++) {
      for (var px = 0; px < 5; px++) {
        var cell = PUZZLE.grid[py] ? PUZZLE.grid[py][px] : null;
        var cx = 115 + px * 50;
        var cy = 55 + py * 36;
        ctx.fillStyle = (cell && cell.type === 'wormhole31') ? PAL.teal :
                        (cell && cell.type === 'wormhole47') ? PAL.rust : '#222830';
        ctx.fillRect(cx, cy, 42, 30);
        var isCur = (PUZZLE.cursor.x === px && PUZZLE.cursor.y === py);
        ctx.strokeStyle = isCur ? PAL.gold : PAL.steel;
        ctx.lineWidth = isCur ? 2 : 1;
        ctx.strokeRect(cx, cy, 42, 30);
        if (cell) {
          var pm = PUZZLE.mask(cell);
          ctx.fillStyle = PAL.fluoro;
          if (pm & 1) ctx.fillRect(cx + 19, cy, 4, 7);
          if (pm & 2) ctx.fillRect(cx + 35, cy + 13, 7, 4);
          if (pm & 4) ctx.fillRect(cx + 19, cy + 23, 4, 7);
          if (pm & 8) ctx.fillRect(cx, cy + 13, 7, 4);
          ctx.fillStyle = PAL.gold;
          ctx.font = '8px monospace';
          var label = (cell.type === 'wormhole31') ? 'W31' :
                      (cell.type === 'wormhole47') ? 'W47' : 'T' + cell.type;
          ctx.fillText(label, cx + 14, cy + 19);
        }
      }
    }
    ctx.lineWidth = 1;
    ctx.fillStyle = (PUZZLE.status === 'DELIVERED') ? PAL.crt :
                    (PUZZLE.status === 'DEADLOCK') ? PAL.red : PAL.paper;
    ctx.font = '10px monospace';
    ctx.fillText('STATUS: ' + PUZZLE.status, 105, 214);
    ctx.fillStyle = PAL.fluoro;
    ctx.fillText('[방향키] 밸브 선택  [E] 회전  [Enter] 투하  [Esc] 닫기', 100, 242);
    ctx.fillStyle = PAL.copper;
    ctx.fillRect(260, 200, 110, 24);
    ctx.strokeStyle = PAL.gold;
    ctx.strokeRect(260, 200, 110, 24);
    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 10px monospace';
    ctx.fillText('[ 캡슐 투하 ]', 280, 216);
  }

  // Draw Save Menu Overlay (functional: navigate / save / load)
  if (G._saveMenu) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.95)';
    ctx.fillRect(120, 40, 240, 190);
    ctx.strokeStyle = PAL.amber;
    ctx.lineWidth = 1;
    ctx.strokeRect(120, 40, 240, 190);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 12px monospace';
    ctx.fillText('『SAVE / LOAD SLOTS』', 145, 62);
    for (var s = 1; s <= 3; s++) {
      var selRow = (G._saveSel === s);
      ctx.fillStyle = selRow ? PAL.teal : '#1E2A30';
      ctx.fillRect(140, 74 + (s - 1) * 42, 200, 34);
      ctx.strokeStyle = selRow ? PAL.gold : PAL.steel;
      ctx.strokeRect(140, 74 + (s - 1) * 42, 200, 34);
      ctx.fillStyle = PAL.paper;
      ctx.font = '11px monospace';
      var meta = (G._slotMeta && G._slotMeta[s - 1]) ? G._slotMeta[s - 1] : '빈 슬롯';
      ctx.fillText((selRow ? '▶ ' : '  ') + 'SLOT ' + s + ' — ' + meta, 150, 95 + (s - 1) * 42);
    }
    ctx.fillStyle = PAL.fluoro;
    ctx.font = '10px monospace';
    ctx.fillText('[↑↓] 선택  [Enter] 저장  [L] 불러오기  [Esc] 닫기', 130, 208);
    if (G._menuMsg) {
      ctx.fillStyle = PAL.crt;
      ctx.fillText(G._menuMsg, 130, 222);
    }
  }

  // Touch HUD (touch-capable devices): D-pad, RUN toggle, [E]
  if (TOUCH.ui && !G._title) {
    ctx.fillStyle = 'rgba(110, 123, 139, 0.35)';
    ctx.fillRect(8, 196, 68, 68);
    ctx.fillStyle = 'rgba(232, 226, 208, 0.55)';
    ctx.fillRect(30, 202, 14, 14);
    ctx.fillRect(30, 244, 14, 14);
    ctx.fillRect(10, 224, 14, 14);
    ctx.fillRect(52, 224, 14, 14);
    ctx.fillStyle = live.run ? PAL.amber : 'rgba(110, 123, 139, 0.5)';
    ctx.fillRect(84, 240, 36, 26);
    ctx.fillStyle = PAL.ink;
    ctx.font = 'bold 9px monospace';
    ctx.fillText('RUN', 92, 256);
    ctx.fillStyle = 'rgba(217, 160, 91, 0.6)';
    ctx.fillRect(436, 236, 34, 30);
    ctx.fillStyle = PAL.ink;
    ctx.fillText('[E]', 445, 254);
  }

  // Scene name toast & fade-in transition
  if (G._sceneToast > 0 && !G._title && !G.dialogue) {
    ctx.globalAlpha = Math.min(1, G._sceneToast / 30);
    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('『' + def.name + '』', 240, 40);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  if (G._fade > 0) {
    ctx.globalAlpha = G._fade / 18;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 480, 270);
    ctx.globalAlpha = 1;
  }

  // Draw Title Screen
  if (G._title) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.88)';
    ctx.fillRect(0, 0, 480, 270);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TO THE SINGULARITY', 240, 100);
    ctx.fillStyle = PAL.paper;
    ctx.font = '12px monospace';
    ctx.fillText('Episode 2: 각주 47개와 4차원 서류 슈트', 240, 130);
    if (G.frame % 60 < 38) {
      ctx.fillStyle = PAL.crt;
      ctx.fillText('[ PRESS SPACE / CLICK TO ENTER ]', 240, 180);
    }
    ctx.textAlign = 'left';
  }

  // Draw Dialogue Box (typewriter + colored speaker names)
  if (G.dialogue && G._drawn) {
    ctx.fillStyle = 'rgba(26, 26, 24, 0.94)';
    ctx.fillRect(20, 190, 440, 68);
    ctx.strokeStyle = PAL.brass;
    ctx.strokeRect(20, 190, 440, 68);
    var whoRow = WHO[G._drawn.who] || [G._drawn.who.toUpperCase(), PAL.gold];
    ctx.fillStyle = whoRow[1];
    ctx.font = 'bold 11px monospace';
    ctx.fillText('[' + whoRow[0] + ']', 30, 208);
    ctx.fillStyle = PAL.paper;
    ctx.font = '11px monospace';
    ctx.fillText(G._drawn.text.substring(0, G._twCount), 30, 230);
    if (G.dialogue.waiting && G._twCount >= G._drawn.text.length && G.frame % 40 < 24) {
      ctx.fillStyle = PAL.gold;
      ctx.fillText('▼', 442, 250);
    }

    // Draw Choices
    if (G.dialogue.choosing && G._drawnChoices) {
      ctx.fillStyle = 'rgba(16, 20, 26, 0.95)';
      ctx.fillRect(80, 60, 320, 120);
      ctx.strokeStyle = PAL.amber;
      ctx.strokeRect(80, 60, 320, 120);
      G._drawnChoices.labels.forEach(function (lbl, idx) {
        ctx.fillStyle = (idx === G.dialogue.choiceSel) ? PAL.crt : PAL.paper;
        var prefix = (idx === G.dialogue.choiceSel) ? '▶ ' : '  ';
        ctx.fillText(prefix + lbl.substring(0, 36), 95, 88 + idx * 24);
      });
    }
  }
}

// Pointer routing shared by mouse click and touch tap
function canvasPoint(clientX, clientY) {
  var rect = cv.getBoundingClientRect();
  return { x: (clientX - rect.left) * (480 / rect.width),
           y: (clientY - rect.top) * (270 / rect.height) };
}

function handlePoint(mx, my) {
  if (G._title) { dismissTitle(false); return; }
  if (G._saveMenu) {
    for (var s = 1; s <= 3; s++) {
      if (mx >= 140 && mx <= 340 && my >= 74 + (s - 1) * 42 && my <= 108 + (s - 1) * 42) {
        G._saveSel = s;
        return;
      }
    }
    return;
  }
  if (PUZZLE.active) {
    for (var py = 0; py < 4; py++) {
      for (var px = 0; px < 5; px++) {
        var cx = 115 + px * 50;
        var cy = 55 + py * 36;
        if (mx >= cx && mx <= cx + 42 && my >= cy && my <= cy + 30) {
          PUZZLE.cursor = { x: px, y: py };
          PUZZLE.rotate(px, py);
          return;
        }
      }
    }
    if (mx >= 260 && mx <= 370 && my >= 200 && my <= 224) PUZZLE.dispatch();
    return;
  }
  if (G.dialogue) {
    if (G.dialogue.choosing && G._drawnChoices) {
      for (var i = 0; i < G._drawnChoices.labels.length; i++) {
        var ly = 80 + i * 24;
        if (my >= ly - 10 && my <= ly + 14) { chooseOption(i); return; }
      }
      return;
    }
    if (G.dialogue.waiting) humanAdvance();
  }
}

cv.addEventListener('click', function (e) {
  AU.init(); AU.resume();
  var p = canvasPoint(e.clientX, e.clientY);
  handlePoint(p.x, p.y);
});

// Real touch layer: D-pad, RUN toggle, [E] button, tap routing
var TOUCH = { ui: ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) };

function touchZone(p) {
  if (p.x <= 76 && p.y >= 196) return 'dpad';
  if (p.x >= 84 && p.x <= 120 && p.y >= 240 && p.y <= 266) return 'run';
  if (p.x >= 436 && p.y >= 236) return 'e';
  return null;
}

function dpadApply(p) {
  var dx = p.x - 42, dy = p.y - 231;
  live.left = live.right = live.up = live.down = false;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 6) live.right = true;
    else if (dx < -6) live.left = true;
  } else {
    if (dy > 6) live.down = true;
    else if (dy < -6) live.up = true;
  }
}

cv.addEventListener('touchstart', function (e) {
  e.preventDefault();
  AU.init(); AU.resume();
  TOUCH.ui = true;
  var t = e.changedTouches[0];
  var p = canvasPoint(t.clientX, t.clientY);
  if (G._title) { dismissTitle(false); return; }
  var zone = (!G._saveMenu && !PUZZLE.active && !G.dialogue) ? touchZone(p) : null;
  if (zone === 'dpad') { dpadApply(p); return; }
  if (zone === 'run') { live.run = !live.run; return; }
  if (zone === 'e') { interactScene(); return; }
  handlePoint(p.x, p.y);
}, { passive: false });

cv.addEventListener('touchmove', function (e) {
  e.preventDefault();
  var t = e.changedTouches[0];
  var p = canvasPoint(t.clientX, t.clientY);
  if (!G._saveMenu && !PUZZLE.active && !G.dialogue && touchZone(p) === 'dpad') dpadApply(p);
}, { passive: false });

cv.addEventListener('touchend', function (e) {
  e.preventDefault();
  live.left = live.right = live.up = live.down = false;
}, { passive: false });

// ============================================================================
// 11. MAIN LOOP WITH FIXED ACCUMULATOR
// ============================================================================
var lastNow = 0;
var acc = 0;
var STEP = 1000 / 60;
var fpsTimes = [];

function noteFrame(now) {
  fpsTimes.push(now);
  while (fpsTimes.length > 2 && now - fpsTimes[0] > 1000) fpsTimes.shift();
}

function pump(now) {
  var dt = now - lastNow;
  lastNow = now;
  if (dt < 0 || dt > 250) dt = 0;
  acc += dt;
  var count = 0;
  while (acc >= STEP && count < 5) {
    update();
    acc -= STEP;
    count++;
  }
  noteFrame(now);
  render();
}

function mainLoop(now) {
  if (!G._manualClock) pump(now);
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);
window.__gameLoop = function (t) {
  if (!G._manualClock) { G._manualClock = true; lastNow = t; acc = 0; fpsTimes = []; }
  pump(t);
};

// ============================================================================
// 12. DEBUG & TESTING API CONTRACT (window.__game.api)
// ============================================================================
window.__game = G;
window.__game.sceneDef = sceneDef;
window.__game.api = {
  step: function (n) { apiSkip(); for (var i = 0; i < n; i++) update(); },
  setSeed: setSeed,
  hash: stateHash,
  teleport: function (scene, x, y) { apiSkip(); enterScene(scene, x, y); },
  input: function (op) { apiSkip(); G.inputQ.push(op); },
  ff: function (b) { apiSkip(); G.ffMode = !!b; },
  save: saveSlot,
  load: function (n) { apiSkip(); return loadSlot(n); },
  fps: function () {
    if (fpsTimes.length < 2) return 60;
    var spanMs = fpsTimes[fpsTimes.length - 1] - fpsTimes[0];
    if (spanMs <= 0) return 60;
    return Math.round(1000 * (fpsTimes.length - 1) / spanMs);
  },
  checkEp1Migration: checkEp1Migration,
  windParticles: windParticles,
  windActive: function () { return windParticles().length > 0; },
  openTubePuzzle: function () { apiSkip(); PUZZLE.active = true; },
  tubePuzzleState: function () { return { active: PUZZLE.active, status: PUZZLE.status }; },
  scrambleTubePuzzle: function () { PUZZLE.init(); },
  rotateValve: function (x, y) { PUZZLE.rotate(x, y); },
  dispatchCapsule: function () { PUZZLE.dispatch(); },
  solveTubePuzzle: function () { return PUZZLE.solve(); },
  activeAudioVoice: function () { return AU.activeVoice; },
  touchInput: function (opts) {
    apiSkip();
    if (opts.right !== undefined) live.right = opts.right;
    if (opts.left !== undefined) live.left = opts.left;
    if (opts.up !== undefined) live.up = opts.up;
    if (opts.down !== undefined) live.down = opts.down;
    if (opts.run !== undefined) live.run = opts.run;
  },
  touchState: function () {
    return { left: live.left, right: live.right, up: live.up, down: live.down, run: live.run };
  },
  interactWith: function (id) {
    apiSkip();
    var objs = sceneDef().objects || [];
    for (var i = 0; i < objs.length; i++) {
      if (objs[i].id === id) { interactObject(objs[i]); return; }
    }
  },
  credits: function () { apiSkip(); startDialogue('credits.start'); },
  autoplay: function (maxFrames) {
    apiSkip();
    enterScene('roof12', 10, 12);
    startDialogue('roof12.start');
    G.ffMode = false;
    var t0 = G.frame;
    var plan = {
      roof12: { obj: 'chute_intake_01', choose: { 'roof12.chute.inspect': 0 } },
      tube_hub: { obj: 'console_tube', choose: { 'tube_hub.console.interact': 0 } },
      mem31: { obj: 'patch_panel_31', choose: {} },
      mem47: { obj: 'chute_outlet_47', choose: {} },
      deep_vault: { obj: 'hologram_bibix', choose: { 'deep_vault.bibix.talk': 1 } }
    };
    var f = 0;
    for (f = 0; f < (maxFrames || 6000); f++) {
      var d = G.dialogue;
      if (d) {
        if (d.choosing) {
          var pick = plan[G.scene] ? plan[G.scene].choose[d.nodeId] : undefined;
          chooseOption(pick === undefined ? 0 : pick);
        } else if (d.waiting) {
          advanceDialogue();
        }
      } else if (PUZZLE.active) {
        if (PUZZLE.status !== 'DELIVERED') { PUZZLE.solve(); PUZZLE.dispatch(); }
      } else {
        var pl = plan[G.scene];
        var objs = sceneDef().objects || [];
        var tgt = null;
        for (var i = 0; i < objs.length; i++) if (objs[i].id === pl.obj) tgt = objs[i];
        if (tgt) {
          var ddx = tgt.x - G.pos.x, ddy = tgt.y - G.pos.y;
          if (Math.abs(ddx) <= 2 && Math.abs(ddy) <= 2) {
            live.left = live.right = live.up = live.down = false;
            interactObject(tgt);
          } else {
            live.right = ddx > 2; live.left = ddx < -2;
            live.down = ddy > 2; live.up = ddy < -2;
            live.run = true;
          }
        }
      }
      update();
      if (G.flags.ep2_cliffhanger) break;
    }
    live.left = live.right = live.up = live.down = false;
    live.run = false;
    return { reached: !!G.flags.ep2_cliffhanger, frames: f, span: G.frame - t0 };
  }
};

// Check media preferences
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  G.flags.reducedMotion = true;
}

})();
</script>
