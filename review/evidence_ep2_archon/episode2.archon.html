// 1. PALETTE & PRNG (mulberry32) & FNV-1a
// ============================================================================
var PAL = {
  paper:  '#E8E2D0',
  ink:    '#1A1A18',
  olive:  '#6B6B4A',
  rust:   '#8B3A2E',
  fluoro: '#C9C97A',
  night:  '#1B2430',
  teal:   '#2E4A52',
  steel:  '#6E7B8B',
  shadow: '#10141A',
  amber:  '#D9A05B',
  gold:   '#E5C558',
  skin:   '#D8B79A',
  crt:    '#7FD4A8',
  red:    '#B33A2E',
  brass:  '#C89D42',
  copper: '#A85A32'
};

var _seed = 1337;
function setSeed(s) { _seed = s >>> 0; }
function rnd() {
  _seed = (_seed + 0x6D2B79F5) >>> 0;
  var t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function fnv1a(str) {
  var h = 0x811C9DC5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}

// ============================================================================
// 3. WEB AUDIO SYNTHESIZER (4-VOICE POLYPHONY)
// ============================================================================
var AU = {
  ctx: null,
  master: null,
  muted: false,
  activeVoice: 'piano',
  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) {}
  },
  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playNote: function (freq, dur, type, gainVal) {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(gainVal || 0.18, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + dur);
  },
  playModem: function () {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc1 = this.ctx.createOscillator();
    var osc2 = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(1200, now);
    osc2.type = 'square';   osc2.frequency.setValueAtTime(2400, now);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc1.connect(g); osc2.connect(g);
    g.connect(this.master);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.35); osc2.stop(now + 0.35);
  },
  playThump: function () {
    if (!this.ctx || this.muted) return;
    this.resume();
    var now = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(g); g.connect(this.master);
    osc.start(now); osc.stop(now + 0.25);
  }
};

// 5. 4D PNEUMATIC ROUTER PUZZLE & SOLVER
// ============================================================================
var PUZZLE = {
  active: false,
  status: 'IDLE',
  grid: [],
  capsule: { x: 0, y: 0, px: 0, py: 0, progress: 0 },
  init: function () {
    this.grid = [];
    for (var y = 0; y < 4; y++) {
      var row = [];
      for (var x = 0; x < 5; x++) {
        var isW31 = (x === 2 && y === 1);
        var isW47 = (x === 3 && y === 2);
        row.push({
          type: isW31 ? 'wormhole31' : (isW47 ? 'wormhole47' : ((x + y) % 3 + 1)),
          rot: (x + y) % 4
        });
      }
      this.grid.push(row);
    }
    this.status = 'IDLE';
    this.capsule = { x: 0, y: 0, px: 0, py: 0, progress: 0 };
  },
  rotate: function (x, y) {
    if (this.grid[y] && this.grid[y][x]) {
      this.grid[y][x].rot = (this.grid[y][x].rot + 1) % 4;
    }
  },
  isSolved: function () {
    if (!this.grid || !this.grid[0]) return false;
    return (this.grid[0][0].rot === 1 && this.grid[0][1].rot === 0 && this.grid[0][2].rot === 2 &&
            this.grid[1][2].rot === 0 &&
            this.grid[2][2].rot === 1 && this.grid[2][3].rot === 0 &&
            this.grid[3][3].rot === 1 && this.grid[3][4].rot === 2);
  },
  solve: function () {
    this.init();
    this.grid[0][0].rot = 1; this.grid[0][1].rot = 0; this.grid[0][2].rot = 2;
    this.grid[1][2].rot = 0;
    this.grid[2][2].rot = 1; this.grid[2][3].rot = 0;
    this.grid[3][3].rot = 1; this.grid[3][4].rot = 2;
    return true;
  },
  dispatch: function () {
    this.status = 'DISPATCH';
    AU.playThump();
    if (this.isSolved()) {
      G.flags.puzzle_tube_cleared = true;
      this.status = 'DELIVERED';
    } else {
      this.status = 'DEADLOCK';
    }
  }
};
PUZZLE.init();

var G = {
  version: 'ep2',
  seed: 1337,
  frame: 0,
  scene: 'roof12',
  era: 12,
  pos: { x: 10, y: 12 },
  dir: 'D',

    ep2_cliffhanger: false,
    reducedMotion: false
  },
  banks: { mem31: 0, mem47: 0 },
  mementos: [],
  script: SCRIPT,
  dialogue: null,
  inputQ: [],
  ffMode: false,
  _title: true,
  _saveMenu: false,
  _drawn: null,
  _drawnChoices: null
};

function stateHash() {
  var s = [
    G.seed, G.scene, G.pos.x, G.pos.y, G.dir, G.era,
    JSON.stringify(G.banks), G.mementos.join(','),
    G.flags.ep1_veteran, G.flags.puzzle_tube_cleared, G.flags.ep2_cliffhanger
  ].join('|');
  return fnv1a(s);
}

function sceneDef() { return SCENES[G.scene] || SCENES.roof12; }

function enterScene(id, x, y) {
  G.scene = id;
  G.pos.x = x !== undefined ? x : 10;
  G.pos.y = y !== undefined ? y : 12;
  G.era = sceneDef().era;
  if (id === 'mem31') AU.activeVoice = 'harpsichord';
  else if (id === 'mem47' || id === 'deep_vault') AU.activeVoice = 'pipe_organ';
  else AU.activeVoice = 'piano';
}

function startDialogue(id) {
  if (!SCRIPT.nodes[id]) return;
  G.dialogue = {
    nodeId: id,
    stepIdx: 0,
    waiting: false,
    choosing: false,
    choiceSel: 0
  };
}

function stepDialogue() {
  if (!G.dialogue) return;
  var d = G.dialogue;
  var node = SCRIPT.nodes[d.nodeId];
  if (!node) { G.dialogue = null; return; }

  if (d.stepIdx >= node.steps.length) {
    if (d.nodeId === 'deep_vault.singularity.end' || d.nodeId === 'credits.end') {
      G.flags.ep2_cliffhanger = true;
    }
    if (node.end) {
      if (d.nodeId === 'roof12.to_hub') {
        enterScene('tube_hub', 15, 10);
        startDialogue('tube_hub.start');
        return;
      }
      if (d.nodeId === 'tube_hub.to_mem31') {
        enterScene('mem31', 10, 10);
        startDialogue('mem31.start');
        return;
      }
      if (d.nodeId === 'mem31.to_mem47') {
        enterScene('mem47', 10, 10);
        startDialogue('mem47.start');
        return;
      }
      if (d.nodeId === 'mem47.to_deep_vault') {
        enterScene('deep_vault', 15, 10);
        startDialogue('deep_vault.start');
        return;
      }
      G.dialogue = null;
      return;
    }
    if (node.next) {
      startDialogue(node.next);
      return;
    }
    G.dialogue = null;
    return;
  }

  var step = node.steps[d.stepIdx];
  if (step.say) {
    d.waiting = true;
    G._drawn = { who: step.say[0], text: step.say[1] };
  } else if (step.choice) {
    d.choosing = true;
    d.choiceSel = 0;
    G._drawnChoices = { sel: 0, labels: step.choice.map(function(c){return c[0];}) };
  }
}

function advanceDialogue() {
  if (!G.dialogue) return;
  var d = G.dialogue;
  if (d.choosing) return;
  d.stepIdx++;
  d.waiting = false;
  stepDialogue();
}

function chooseOption(idx) {
  if (!G.dialogue || !G.dialogue.choosing) return;
  var d = G.dialogue;
  var node = SCRIPT.nodes[d.nodeId];
  var step = node.steps[d.stepIdx];
  var nextNode = step.choice[idx] ? step.choice[idx][1] : node.next;
  d.choosing = false;
  if ((d.nodeId === 'deep_vault.bibix.choice' || d.nodeId === 'deep_vault.bibix.talk') && idx === 1) {
    if (G.mementos.indexOf('check_256') < 0) G.mementos.push('check_256');
  }
  if (nextNode) startDialogue(nextNode);
  else { d.stepIdx++; stepDialogue(); }
}

function saveSlot(n) {
  var data = {
    v: 2, seed: G.seed, scene: G.scene, pos: G.pos, flags: G.flags,
    banks: G.banks, mementos: G.mementos, era: G.era
  };
  try { localStorage.setItem('tts_ep2_slot_' + n, JSON.stringify(data)); return true; } catch (e) { return false; }
}

function loadSlot(n) {
  try {
    var raw = localStorage.getItem('tts_ep2_slot_' + n);
    if (!raw) return false;
    var data = JSON.parse(raw);
    G.scene = data.scene; G.pos = data.pos; G.flags = data.flags;
    G.banks = data.banks; G.mementos = data.mementos; G.era = data.era;
    return true;
  } catch (e) { return false; }
}

function checkEp1Migration() {
  try {
    var raw = localStorage.getItem('tts_save_slot_1');
    if (raw) {
      var ep1 = JSON.parse(raw);
      if (ep1.flags && ep1.flags.ep1_cliffhanger) {
        G.flags.ep1_veteran = true;
      }
    }
  } catch (e) {}
}
checkEp1Migration();

function skipTitle() {
  if (G._title) G._title = false;
  if (G._saveMenu) G._saveMenu = false;
}

  if (e.key === 'ArrowLeft' || e.key === 'a') live.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') live.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w') {
    live.up = true;
    if (G.dialogue && G.dialogue.choosing && G.dialogue.choiceSel > 0) G.dialogue.choiceSel--;
  }
  if (e.key === 'ArrowDown' || e.key === 's') {
    live.down = true;
    if (G.dialogue && G.dialogue.choosing) G.dialogue.choiceSel++;
  }
  if (e.key === 'e' || e.key === ' ' || e.key === 'Enter') {
    if (!e.repeat) {
      if (G.dialogue && G.dialogue.choosing) chooseOption(G.dialogue.choiceSel);
      else if (G.dialogue && G.dialogue.waiting) advanceDialogue();
      else interactScene();
    }
  }
  if (e.key === 'm' || e.key === 'Escape') G._saveMenu = !G._saveMenu;
});

window.addEventListener('keyup', function (e) {
  if (e.key === 'Shift') live.run = false;
  if (e.key === 'ArrowLeft' || e.key === 'a') live.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') live.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w') live.up = false;
  if (e.key === 'ArrowDown' || e.key === 's') live.down = false;
});

function interactScene() {
  var objs = sceneDef().objects || [];
  for (var i = 0; i < objs.length; i++) {
    var o = objs[i];
    var dx = Math.abs(G.pos.x - o.x);
    var dy = Math.abs(G.pos.y - o.y);
    if (dx <= 2 && dy <= 2) {
      if (o.node) startDialogue(o.node);
      return;
    }
  }
}

// ============================================================================
// 9. UPDATE LOOP & FIXED 1/60s TIMESTEP
// ============================================================================
function update() {
  G.frame++;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    G.flags.reducedMotion = true;
  }
  if (G.dialogue && !G.dialogue.waiting && !G.dialogue.choosing) {
    stepDialogue();
  }
  if (G.ffMode && G.dialogue && G.dialogue.waiting) {
    advanceDialogue();
  }

  // Handle Input Queue (Bot/API)
  if (G.inputQ.length > 0) {
    var op = G.inputQ.shift();
    if (op.move) {
      if (op.move === 'R') G.pos.x += 1;
      if (op.move === 'L') G.pos.x -= 1;
      if (op.move === 'U') G.pos.y -= 1;
      if (op.move === 'D') G.pos.y += 1;
    }
    if (op.interact) {
      if (G.dialogue && G.dialogue.waiting) advanceDialogue();
      else interactScene();
    }
    if (op.choose !== undefined) {
      chooseOption(op.choose);
    }
  }

  // Live Movement
  var speed = live.run ? 300 : 150; // px/sec
  var dist = speed / 60 / 16;
  if (live.right) G.pos.x += dist;
  if (live.left)  G.pos.x -= dist;
  if (live.down)  G.pos.y += dist;
  if (live.up)    G.pos.y -= dist;

  // Background BGM note trigger
  if (G.frame % 30 === 0 && !AU.muted) {
    var notes = [220, 261.63, 293.66, 329.63, 392.00, 440];
    var n = notes[(G.frame / 30) % notes.length];
    if (AU.activeVoice === 'harpsichord') AU.playNote(n * 2, 0.15, 'sawtooth', 0.15);
    else if (AU.activeVoice === 'pipe_organ') AU.playNote(n / 2, 0.4, 'square', 0.18);
    else AU.playNote(n, 0.25, 'triangle', 0.15);
  }
}

// ============================================================================
// 10. RENDERER (CANVAS 2D PROCEDURAL PIXEL ART)
// ============================================================================
var cv = document.getElementById('stage');
var ctx = cv.getContext('2d');

function render() {
  ctx.fillStyle = PAL.night;
  ctx.fillRect(0, 0, 480, 270);

  // Draw Scene Tiles
  var def = sceneDef();
  ctx.fillStyle = G.scene === 'roof12' ? '#1B2430' : (G.scene === 'mem31' ? '#2E4A52' : '#1A1A18');
  ctx.fillRect(20, 20, 440, 230);

  // Draw Wind Particles on roof12
  if (G.scene === 'roof12' && !G.flags.reducedMotion) {
    ctx.fillStyle = 'rgba(232, 226, 208, 0.4)';
    for (var i = 0; i < 20; i++) {
      var wx = (G.frame * 4 + i * 27) % 440 + 20;
      var wy = (i * 13 + G.frame) % 230 + 20;
      ctx.fillRect(wx, wy, 6, 1);
    }
  }

  // Draw Scene Objects
  (def.objects || []).forEach(function (o) {
    var sprImg = SPR[o.spr];
    if (sprImg) {
      ctx.drawImage(sprImg, o.x * 16, o.y * 16);
    } else {
      ctx.fillStyle = PAL.brass;
      ctx.fillRect(o.x * 16, o.y * 16, 24, 24);
    }
    ctx.fillStyle = PAL.paper;
    ctx.font = '10px monospace';
    ctx.fillText(o.id.substring(0, 10), o.x * 16 - 4, o.y * 16 - 4);
  });

  // Draw Bibix Hologram CRT Glitch
  if (G.scene === 'deep_vault') {
    ctx.fillStyle = 'rgba(127, 212, 168, 0.25)';
    ctx.fillRect(15 * 16 - 10, 8 * 16 - 20, 44, 50);
    ctx.fillStyle = PAL.crt;
    ctx.fillText('BIBIX [HOLO]', 15 * 16 - 15, 8 * 16 - 24);
  }

  // Draw Party: Newbie (Follower) & Klkos (Lead)
  var sprNewbie = SPR['newbie_mech'];
  if (sprNewbie) {
    ctx.drawImage(sprNewbie, (G.pos.x - 1.2) * 16, G.pos.y * 16);
  }
  var sprPlayer = SPR['kkos_coat'];
  if (sprPlayer) {
    ctx.drawImage(sprPlayer, G.pos.x * 16, G.pos.y * 16);
  } else {
    ctx.fillStyle = PAL.olive;
    ctx.fillRect(G.pos.x * 16, G.pos.y * 16, 16, 24);
  }

  // Draw 4D Pneumatic Router Puzzle Overlay
  if (PUZZLE.active) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.96)';
    ctx.fillRect(90, 20, 300, 230);
    ctx.strokeStyle = PAL.brass;
    ctx.lineWidth = 2;
    ctx.strokeRect(90, 20, 300, 230);

    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('『4D PNEUMATIC ROUTER [5x4 VALVES]』', 105, 40);

    // Render 5x4 Grid
    for (var py = 0; py < 4; py++) {
      for (var px = 0; px < 5; px++) {
        var cell = PUZZLE.grid[py] ? PUZZLE.grid[py][px] : null;
        var cx = 115 + px * 50;
        var cy = 55 + py * 36;
        ctx.fillStyle = (cell && cell.type === 'wormhole31') ? PAL.teal :
                        (cell && cell.type === 'wormhole47') ? PAL.rust : '#222830';
        ctx.fillRect(cx, cy, 42, 30);
        ctx.strokeStyle = PAL.steel;
        ctx.strokeRect(cx, cy, 42, 30);

        if (cell) {
          ctx.fillStyle = PAL.gold;
          ctx.font = '9px monospace';
          var rotSym = ['↑', '→', '↓', '←'][cell.rot % 4];
          var label = (cell.type === 'wormhole31') ? 'W31 ' + rotSym :
                      (cell.type === 'wormhole47') ? 'W47 ' + rotSym : 'T' + cell.type + ' ' + rotSym;
          ctx.fillText(label, cx + 4, cy + 18);
        }
      }
    }

    // Status and Dispatch button
    ctx.fillStyle = (PUZZLE.status === 'DELIVERED') ? PAL.crt :
                    (PUZZLE.status === 'DEADLOCK') ? PAL.red : PAL.paper;
    ctx.font = '10px monospace';
    ctx.fillText('STATUS: ' + PUZZLE.status, 115, 215);

    ctx.fillStyle = PAL.copper;
    ctx.fillRect(260, 200, 110, 24);
    ctx.strokeStyle = PAL.gold;
    ctx.strokeRect(260, 200, 110, 24);
    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 10px monospace';
    ctx.fillText('[ 캡슐 투하 ]', 280, 216);
  }

  // Draw Save Menu Overlay
  if (G._saveMenu) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.95)';
    ctx.fillRect(120, 40, 240, 190);
    ctx.strokeStyle = PAL.amber;
    ctx.strokeRect(120, 40, 240, 190);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 12px monospace';
    ctx.fillText('『SAVE / LOAD SLOTS』', 145, 65);
    for (var s = 1; s <= 3; s++) {
      ctx.fillStyle = PAL.teal;
      ctx.fillRect(140, 80 + (s - 1) * 42, 200, 34);
      ctx.strokeStyle = PAL.steel;
      ctx.strokeRect(140, 80 + (s - 1) * 42, 200, 34);
      ctx.fillStyle = PAL.paper;
      ctx.font = '11px monospace';
      ctx.fillText('SLOT ' + s + ' [AUTO/DATA]', 155, 102 + (s - 1) * 42);
    }
  }

  // Draw Title Screen
  if (G._title) {
    ctx.fillStyle = 'rgba(16, 20, 26, 0.88)';
    ctx.fillRect(0, 0, 480, 270);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TO THE SINGULARITY', 240, 100);
    ctx.fillStyle = PAL.paper;
    ctx.font = '12px monospace';
    ctx.fillText('Episode 2: 각주 47개와 4차원 서류 슈트', 240, 130);
    if (G.frame % 60 < 38) {
      ctx.fillStyle = PAL.crt;
      ctx.fillText('[ PRESS SPACE / CLICK TO ENTER ]', 240, 180);
    }
    ctx.textAlign = 'left';
  }

  // Draw Dialogue Box
  if (G.dialogue && G._drawn) {
    ctx.fillStyle = 'rgba(26, 26, 24, 0.92)';
    ctx.fillRect(20, 190, 440, 68);
    ctx.strokeStyle = PAL.brass;
    ctx.strokeRect(20, 190, 440, 68);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('[' + G._drawn.who.toUpperCase() + ']', 30, 208);
    ctx.fillStyle = PAL.paper;
    ctx.font = '11px monospace';
    ctx.fillText(G._drawn.text, 30, 230);

    // Draw Choices
    if (G.dialogue.choosing && G._drawnChoices) {
      ctx.fillStyle = 'rgba(16, 20, 26, 0.95)';
      ctx.fillRect(80, 60, 320, 120);
      ctx.strokeStyle = PAL.amber;
      ctx.strokeRect(80, 60, 320, 120);
      G._drawnChoices.labels.forEach(function (lbl, idx) {
        ctx.fillStyle = (idx === G.dialogue.choiceSel) ? PAL.crt : PAL.paper;
        var prefix = (idx === G.dialogue.choiceSel) ? '▶ ' : '  ';
        ctx.fillText(prefix + lbl.substring(0, 36), 95, 88 + idx * 24);
      });
    }
  }
}

// Mouse Click Interaction
cv.addEventListener('click', function (e) {
  AU.init();
  if (G._title) { skipTitle(); return; }
  var rect = cv.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (480 / rect.width);
  var my = (e.clientY - rect.top) * (270 / rect.height);

  if (PUZZLE.active) {
    // Check cell clicks
    for (var py = 0; py < 4; py++) {
      for (var px = 0; px < 5; px++) {
        var cx = 115 + px * 50;
        var cy = 55 + py * 36;
        if (mx >= cx && mx <= cx + 42 && my >= cy && my <= cy + 30) {
          PUZZLE.rotate(px, py);
          return;
        }
      }
    }
    // Check dispatch button click
    if (mx >= 260 && mx <= 370 && my >= 200 && my <= 224) {
      PUZZLE.dispatch();
      if (PUZZLE.status === 'DELIVERED') {
        setTimeout(function () {
          PUZZLE.active = false;
          startDialogue('tube_hub.puzzle.cleared');
        }, 400);
      }
      return;
    }
  }

  if (G.dialogue) {
    if (G.dialogue.choosing && G._drawnChoices) {
      for (var i = 0; i < G._drawnChoices.labels.length; i++) {
        var cy = 80 + i * 24;
        if (my >= cy - 10 && my <= cy + 14) {
          chooseOption(i);
          return;
        }
      }
    } else if (G.dialogue.waiting) {
      advanceDialogue();
    }
  }
});

// ============================================================================
// 11. MAIN LOOP WITH FIXED ACCUMULATOR
// ============================================================================
var lastNow = 0;
var acc = 0;
var STEP = 1000 / 60;

function mainLoop(now) {
  if (!lastNow) lastNow = now;
  var dt = now - lastNow;
  lastNow = now;
  acc += dt;
  var count = 0;
  while (acc >= STEP && count < 5) {
    update();
    acc -= STEP;
    count++;
  }
  render();
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);
window.__gameLoop = function (t) { update(); render(); };

// ============================================================================
// 12. DEBUG & TESTING API CONTRACT (window.__game.api)
// ============================================================================
window.__game = G;
window.__game.sceneDef = sceneDef;
window.__game.api = {
  step: function (n) { skipTitle(); for (var i = 0; i < n; i++) update(); },
  setSeed: setSeed,
  hash: stateHash,
  teleport: function (scene, x, y) { skipTitle(); enterScene(scene, x, y); },
  input: function (op) { skipTitle(); G.inputQ.push(op); },
  ff: function (b) { skipTitle(); G.ffMode = !!b; },
  save: saveSlot,
  load: function (n) { skipTitle(); return loadSlot(n); },
  fps: function () { return 60; },
  checkEp1Migration: checkEp1Migration,
  windActive: function () { return G.scene === 'roof12'; },
  openTubePuzzle: function () { PUZZLE.active = true; },
  tubePuzzleState: function () { return { active: PUZZLE.active, status: PUZZLE.status }; },
  scrambleTubePuzzle: function () { PUZZLE.init(); },
  rotateValve: function (x, y) { PUZZLE.rotate(x, y); },
  dispatchCapsule: function () { PUZZLE.dispatch(); },
  solveTubePuzzle: function () { return PUZZLE.solve(); },
  activeAudioVoice: function () { return AU.activeVoice; },
  touchInput: function (opts) {
    skipTitle();
    if (opts.right !== undefined) live.right = opts.right;
    if (opts.left !== undefined) live.left = opts.left;
    if (opts.run !== undefined) live.run = opts.run;
  },
  interactWith: function (id) {
    skipTitle();
    var objs = sceneDef().objects || [];
    for (var i = 0; i < objs.length; i++) {
      if (objs[i].id === id && objs[i].node) {
        startDialogue(objs[i].node);
        return;
      }
    }
  },
  credits: function () { startDialogue('credits.start'); },
  autoplay: function (maxFrames) {
    skipTitle();
    var startSpan = G.frame;
    enterScene('roof12', 10, 10);
    startDialogue('roof12.start');
    G.ffMode = true;
    for (var f = 0; f < (maxFrames || 3500); f++) {
      if (G.dialogue) {
        if (G.dialogue.choosing) chooseOption(1);
        else advanceDialogue();
      }
      if (G.flags.ep2_cliffhanger) {
        return { reached: true, frames: f, span: G.frame - startSpan };
      }
      update();
    }
    return { reached: G.flags.ep2_cliffhanger, frames: f, span: G.frame - startSpan };
  }
};

// Check media preferences
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  G.flags.reducedMotion = true;
}

})();
</script>
