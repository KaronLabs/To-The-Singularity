// ---------------- seeded RNG (mulberry32) ----------------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// render-only stateless hash noise: pure fn of ints, touches no state
function h2(a, b) {
  var n = (a * 374761393 + b * 668265263) | 0;
  n = (n ^ (n >>> 13)) | 0; n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

// ---------------- FNV-1a hash ----------------
function fnv(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8);
}

// GAME STATE  (logic — unchanged from v1)
// ================================================================
var G = {
  version: 'ep3',
  seed: 1, rng: mulberry32(1), rngDraws: 0,
  frame: 0, scene: 'lobby', era: 4,
  pos: { x: 3 * TILE, y: 5 * TILE },
  facing: 'D',
  player: { spr: 'penguin4' },
  flags: {},
  banks: { mem0: 0, mem4: 0, mem12: 0 },
  mementos: [],
  bankGiven: {},
  puzzleDone: {},
  inputQ: [],
  dialogue: null,
  ffMode: false,
  puzzle: null,
  corridor: null,
  vHist: [],
  script: SCRIPT,
  _title: true,
  _saveMenu: false,
  _saveSlotSel: 1,
  _gauge: 70.0,
  _lastTouchAdvanceFrame: 0,
};

function rnd() { G.rngDraws++; return G.rng(); }
function setSeed(n) { G.seed = n >>> 0; G.rng = mulberry32(G.seed); G.rngDraws = 0; }
function sceneDef() { return SCENES[G.scene]; }

function enterScene(id, x, y) {
  var sc = SCENES[id];
  if (!sc) return;
  G.scene = id;
  G.era = sc.era;
  G.player.spr = ({ mem0: 'penguin', mem4: 'penguin4', mem12: 'penguin12' })[id] || 'penguin4';
  if (x !== undefined) { G.pos.x = x * TILE; G.pos.y = y * TILE; }
  else { G.pos.x = 2 * TILE; G.pos.y = Math.floor(sc.h / 2) * TILE; }
  G.vHist = [];
  if (sc.corridor) resetCorridor();
  if (sc.onEnter && !G.flags['entered_' + id]) {
    G.flags['entered_' + id] = true;
    startDialogue(sc.onEnter);
  }
}

// ---------------- dialogue ----------------
function startDialogue(nodeId) {
  if (!SCRIPT.nodes[nodeId]) return;
  G.dialogue = { nodeId: nodeId, stepIdx: 0, hold: 0 };
}

function stepDialogue() {
  var d = G.dialogue;
  if (!d) return;
  var node = SCRIPT.nodes[d.nodeId];
  if (!node) { G.dialogue = null; return; }
  var guard = 0;
  while (d && guard++ < 200) {
    node = SCRIPT.nodes[d.nodeId];
    if (d.stepIdx >= node.steps.length) {
      if (node.next && !node.end) { d.nodeId = node.next; d.stepIdx = 0; continue; }
      if (node.next && node.end) { G.dialogue = null; return; }
      G.dialogue = null; return;
    }
    var op = node.steps[d.stepIdx];
    if (op.say !== undefined) {
      d.stepIdx++;
      // say lines WAIT for input; hold only times the typewriter reveal
      if (!G.ffMode) { d.hold = 24; d.waiting = true; return; }
      continue;
    }
    if (op.pause !== undefined) {
      d.stepIdx++;
      // pauses auto-continue when the hold expires
      if (!G.ffMode) { d.hold = op.pause; d.waiting = false; return; }
      continue;
    }
    if (op.flag !== undefined) { G.flags[op.flag[0]] = op.flag[1]; d.stepIdx++; continue; }
    if (op.flash !== undefined) { G.flags._flash = G.frame; d.stepIdx++; continue; }
    if (op.scene !== undefined) { d.stepIdx++; enterScene(op.scene); continue; }
    if (op.gauge !== undefined) { G._gauge += op.gauge; d.stepIdx++; continue; }
    if (op.stamp !== undefined) {
      G._lastStamp = { official: op.stamp === 'official' };
      G._stampF = 24;
      d.stepIdx++; continue;
    }
    if (op.choice !== undefined) {
      var q = G.inputQ[0];
      if (q && q.choose !== undefined) {          // debug queue path
        G.inputQ.shift();
        var pick = op.choice[q.choose] ? q.choose : 0;
        d.nodeId = op.choice[pick][1]; d.stepIdx = 0; continue;
      }
      if (G.ffMode) {                             // bot/fast-forward picks the historical answer
        var fpick = op.correct !== undefined ? op.correct : 0;
        d.nodeId = op.choice[fpick][1]; d.stepIdx = 0; continue;
      }
      d.choosing = { sel: 0, opts: op.choice };   // humans: ArrowUp/Down + E
      d.waiting = true;
      return;
    }
    d.stepIdx++;
  }
}

// ---------------- interaction ----------------
function findObject(id) {
  var sc = sceneDef();
  for (var i = 0; i < sc.objects.length; i++) if (sc.objects[i].id === id) return sc.objects[i];
  return null;
}

function interactObject(obj) {
  if (!obj) return;
  if (obj.kind === 'deco') return;
  if (obj.kind === 'bench') { benchInteract(obj); return; }
  if (obj.kind === 'mail') { mailInteract(obj); return; }
  if (obj.kind === 'bank') {
    if (!G.bankGiven[obj.id]) {
      G.bankGiven[obj.id] = true;
      var mem = obj.id.split('_')[1];
      if (G.banks[mem] !== undefined && G.banks[mem] < 5) G.banks[mem]++;
      startDialogue(obj.node);
      return;
    }
    startDialogue(obj.node2 || obj.node);   // 재조사 (콘텐츠 2차) — 카운트 동결
    return;
  }
  if (obj.kind === 'memento') {
    if (G.banks[obj.mem] < 5) { startDialogue(obj.refuse); return; }
    if (!G.puzzleDone[obj.mem]) {
      if (!G.puzzle || G.puzzle.mem !== obj.mem) openPuzzle(obj.mem);
      return;
    }
    if (G.mementos.indexOf(obj.mem) < 0) {
      G.mementos.push(obj.mem);
      startDialogue(obj.open);
    }
    return;
  }
  if (obj.kind === 'door') {
    if (G.mementos.indexOf(obj.mem) < 0) { startDialogue(obj.refuse); return; }
    enterScene(obj.corridor, 2, 4);
    return;
  }
  if (obj.node2) {
    if (!G.bankGiven[obj.id]) {
      G.bankGiven[obj.id] = true;
      startDialogue(obj.node);
      return;
    }
    startDialogue(obj.node2);
    return;
  }
  startDialogue(obj.node);
}

function nearestObject() {
  var sc = sceneDef(), best = null, bd = 1e9;
  for (var i = 0; i < sc.objects.length; i++) {
    var o = sc.objects[i];
    var dx = o.x * TILE - G.pos.x, dy = o.y * TILE - G.pos.y;
    var d = Math.abs(dx) + Math.abs(dy);
    if (d < bd) { bd = d; best = o; }
  }
  return bd <= TILE * 1.6 ? best : null;
}

// ---------------- stamp puzzle (lights-out 5x3) ----------------
function openPuzzle(mem) {
  var grid = [];
  for (var i = 0; i < 15; i++) grid.push(false);
  var presses = 4 + Math.floor(rnd() * 5);
  for (var p = 0; p < presses; p++) pressPuzzle(grid, Math.floor(rnd() * 15));
  if (puzzleSolved(grid)) pressPuzzle(grid, 7);   // never open in an already-solved state
  G.puzzle = { mem: mem, grid: grid, active: true };
}
function pressPuzzle(grid, i) {
  var x = i % 5, y = Math.floor(i / 5);
  var flip = function (xx, yy) {
    if (xx < 0 || xx > 4 || yy < 0 || yy > 2) return;
    var k = yy * 5 + xx; grid[k] = !grid[k];
  };
  flip(x, y); flip(x - 1, y); flip(x + 1, y); flip(x, y - 1); flip(x, y + 1);
}
function puzzleSolved(grid) {
  for (var i = 0; i < 15; i++) if (grid[i]) return false;
  return true;
}
function solvePuzzleNow() {
  var pz = G.puzzle;
  if (!pz) return false;
  for (var mask = 0; mask < 32; mask++) {
    var g = pz.grid.slice();
    for (var x = 0; x < 5; x++) if (mask & (1 << x)) pressPuzzle(g, x);
    for (var y = 1; y < 3; y++)
      for (var x2 = 0; x2 < 5; x2++)
        if (g[(y - 1) * 5 + x2]) pressPuzzle(g, y * 5 + x2);
    if (puzzleSolved(g)) {
      pz.grid = g; pz.active = false;
      G.puzzleDone[pz.mem] = true;
      var memObj = null, sc = sceneDef();
      for (var i = 0; i < sc.objects.length; i++)
        if (sc.objects[i].kind === 'memento' && sc.objects[i].mem === pz.mem) memObj = sc.objects[i];
      G.puzzle = null;
      if (memObj) interactObject(memObj);

    }

}

// ---------------- crowbar corridor ----------------
function resetCorridor() {
  G.corridor = { dwell: 0, samples: [], passed: false, gag: 0, dwellEverOk: false };
  G.flags.corridor_pass = false;
}
function corridorEndX() { return (sceneDef().w - 3) * TILE; }
function updateCorridor(dxAbs) {
  var c = G.corridor;
  if (!c || c.passed) return;
  var v = dxAbs;
  G.vHist.push(v); if (G.vHist.length > 5) G.vHist.shift();
  var vAvg = 0;
  for (var i = 0; i < G.vHist.length; i++) vAvg += G.vHist[i];
  vAvg /= G.vHist.length;
  var moving = vAvg > 0.02;
  var okSpeed = vAvg <= V_MAX_PXF && moving;
  c.samples.push(moving ? 0 : 1);
  if (c.samples.length > DWELL_FRAMES) c.samples.shift();
  if (okSpeed) c.dwell++; else c.dwell = 0;
  var zeroRatio = 0;
  for (var j = 0; j < c.samples.length; j++) zeroRatio += c.samples[j];
  zeroRatio /= (c.samples.length || 1);
  var dwellOk = c.dwell >= DWELL_FRAMES && zeroRatio < ZERO_RATIO_MAX;
  if (dwellOk) c.dwellEverOk = true;   // per-attempt, cleared by resetCorridor/throwback
  if (G.pos.x >= corridorEndX()) {
    if (c.dwellEverOk) {
      c.passed = true;
      G.flags.corridor_pass = true;
      G.flags[G.scene + '_pass'] = true;
      startDialogue(sceneDef().diveNode);
    } else {
      c.gag = Math.min(c.gag + 1, 3);   // gag lines escalate and stay
      G.pos.x = 2 * TILE;
      c.dwellEverOk = false;
      c.dwell = 0; c.samples = []; G.vHist = [];
    }
  }
}

// ---------------- update (fixed step) ----------------
function update() {
  G.frame++;
  if (G._saveMenu) return;
  var sc = sceneDef();
  var dx = 0, dy = 0;

  if (G.dialogue) {
    var d = G.dialogue;
    if (d.choosing) {
      var qc = G.inputQ[0];
      if (qc && qc.choose !== undefined) { G.inputQ.shift(); chooseOption(qc.choose); }
    }
    else if (d.hold > 0) { d.hold--; }
    else if (!d.waiting && (!G._title || d.stepIdx === 0)) stepDialogue();   // only pauses/op-chains auto-continue
  } else if (G._title) {
    return;
  } else {
    var op = G.inputQ[0];
    if (op) {
      if (op.move !== undefined) {
        var sp = op.run ? RUN_PXF : WALK_PXF;
        if (op.move === 'L') dx = -sp;
        if (op.move === 'R') dx = sp;
        if (op.move === 'U') dy = -sp;
        if (op.move === 'D') dy = sp;
        G.facing = op.move;
        op.frames--;
        if (op.frames <= 0) G.inputQ.shift();
      } else if (op.interact !== undefined) {
        G.inputQ.shift();
        var o = nearestObject();
        if (o) interactObject(o);
      } else if (op.choose !== undefined) {
        G.inputQ.shift();
      } else G.inputQ.shift();
    } else if (live.keys) {
      var sp2 = live.run ? RUN_PXF : WALK_PXF;   // Shift = 달리기 (복도에서 벌 받는 그 속도)
      if (live.left)  { dx = -sp2; G.facing = 'L'; }
      if (live.right) { dx = sp2;  G.facing = 'R'; }
      if (live.up)    { dy = -sp2; G.facing = 'U'; }
      if (live.down)  { dy = sp2;  G.facing = 'D'; }
    }
  }

  var nx = G.pos.x + dx, ny = G.pos.y + dy;
  var maxX = (sc.w - 2) * TILE, maxY = (sc.h - 2) * TILE;
  if (nx < TILE) nx = TILE; if (nx > maxX) nx = maxX;
  if (ny < TILE) ny = TILE; if (ny > maxY) ny = maxY;
  var realDx = Math.abs(nx - G.pos.x);
  var moved = Math.abs(nx - G.pos.x) + Math.abs(ny - G.pos.y);
  G.pos.x = nx; G.pos.y = ny;
  G._walkPhase = moved > 0.01 ? (G._walkPhase || 0) + 1 : 0;   // render-only cadence

  if (sc.corridor) updateCorridor(realDx);
  updateTrial(moved);
}

// ---------------- state hash ----------------
function stateHash() {
  var fl = [];
  for (var k in G.flags) if (k[0] !== '_') fl.push(k + '=' + G.flags[k]);
  fl.sort();
  var s = [G.scene, G.era, Math.round(G.pos.x * 100) / 100, Math.round(G.pos.y * 100) / 100,
           G.banks.mem0, G.banks.mem4, G.banks.mem12,
           G.mementos.slice().sort().join(','), fl.join('|')].join('#');
  return fnv(s);
}

// ---------------- autoplay bot ----------------
function botTick() {
  if (G.dialogue) { stepDialogue(); return; }
  if (G.scene === 'lobby') { G.inputQ = [{ move: 'R', frames: 4 }]; return; }
  var target = null;
  if (G.scene === 'court') {
    if (G.flags.summon) target = findObject(G.flags.summon);
    if (!target) return;
  } else {
    var sc = sceneDef();
    for (var i = 0; i < sc.objects.length; i++) {
      var o = sc.objects[i];
      if ((o.kind === 'npc' || o.kind === 'mail') && !G.bankGiven[o.id]) { target = o; break; }
    }
    if (!target) return;
  }
  var dx = target.x * TILE - G.pos.x, dy = target.y * TILE - G.pos.y;
  if (Math.abs(dx) + Math.abs(dy) <= TILE * 1.4) { interactObject(target); return; }
  if (Math.abs(dx) > 2) G.inputQ = [{ move: dx > 0 ? 'R' : 'L', frames: 2 }];
  else G.inputQ = [{ move: dy > 0 ? 'D' : 'U', frames: 2 }];
}
function autoplay(maxFrames) {
  var start = G.frame;
  G.ffMode = true;
  while (G.frame - start < maxFrames) {
    if (G.flags.ep3_done) return true;
    botTick();
    update();
  }
  return !!G.flags.ep3_done;
}

addEventListener('keydown', function (e) {

      advanceDialogue();

  if (e.key === 'm' || e.key === 'M' || e.key === 'Escape') {
    G._saveMenu = !G._saveMenu;
    e.preventDefault();
    return;
  }
  if (G._saveMenu) {
    if (e.key === 'ArrowUp' || e.key === 'w') {

    if (e.key === 'ArrowDown' || e.key === 's') {
      G._saveSlotSel = Math.min(3, G._saveSlotSel + 1);
      e.preventDefault(); return;
    }
    if (e.key === 's' || e.key === 'S' || e.key === 'Enter') {
      saveSlot(G._saveSlotSel);
      e.preventDefault(); return;
    }
    if (e.key === 'l' || e.key === 'L') {
      loadSlot(G._saveSlotSel);

    e.preventDefault();
    return;

    var chs = G.dialogue.choosing, cn = chs.opts.length;

  }

  var my = (touch.clientY - r.top) * (VH / r.height);
  if (mx <= 60 && my >= VH - 60) {
    var dx = mx - 35, dy = my - (VH - 35);
    live.left = dx < -6;
    live.right = dx > 6;
    live.up = dy < -6;
    live.down = dy > 6;
  }
}, { passive: false });

cv.addEventListener('touchend', function (e) {
  if (e.touches.length === 0) {
    live.left = false; live.right = false; live.up = false; live.down = false;
  }
}, { passive: false });

// ================================================================
// AUDIO — 〈각주를 위하여〉 (For Footnotes). Web Audio, zero files.
// Arrangement = f(era footnote count): 0=musicbox solo, 4=+bass,
// 12=+arpeggio, 7.5F=full 47-voice era. Render-side only — never
// touches game logic. Starts on first user gesture (autoplay policy).
// ================================================================
var AU = { ctx: null, master: null, muted: false, beat: 0, nextT: 0,
           lastEra: 'x', lastFlash: -1, lastSayKey: '', lastStepBucket: 0,
           hum: null };
var BPM = 72, BEAT = 60 / BPM;      // quarter = 0.833s
var NOTE = { A2:110.0, E3:164.81, A3:220.0, C4:261.63, D4:293.66, E4:329.63,
             F4:349.23, G4:392.0, A4:440.0, B4:493.88, C5:523.25, D5:587.33, E5:659.26 };
// two 4-bar phrases, quarter-note lead (0 = rest)
var LEAD = ['A4','C5','B4','E5', 'C5','B4','A4',0, 'F4','A4','G4','C5', 'A4','G4','E4',0];
var ARP  = ['A3','C4','E4','C4'];   // eighths, era>=12
var COUNTER = ['E4','D4','C4','B4','C4','D4','E4','G4'];  // half-notes, 7.5F

function auInit() {
  if (AU.ctx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.32;
    AU.master.connect(AU.ctx.destination);
    AU.nextT = AU.ctx.currentTime + 0.1;
  } catch (e) { AU.ctx = null; }
}
function auNow() { return AU.ctx ? AU.ctx.currentTime : 0; }

function voice(freq, t, dur, type, gainV, filterHz, detune) {
  if (!AU.ctx || AU.muted || !freq) return;
  var o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  if (detune) o.detune.value = detune;
  var dst = AU.master;
  if (filterHz) {
    var f = AU.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterHz;
    o.connect(g); g.connect(f); f.connect(dst);
  } else { o.connect(g); g.connect(dst); }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gainV, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function musicbox(n, t, g) { if (n) { voice(NOTE[n], t, 1.4, 'sine', g, 0, 0); voice(NOTE[n] * 3, t, 0.5, 'sine', g * 0.18, 0, 4); } }
function piano(n, t, g) { if (n) { voice(NOTE[n], t, 1.1, 'triangle', g, 1800, 0); voice(NOTE[n], t, 1.1, 'triangle', g * 0.5, 1800, 7); } }
function bassN(n, t, g) { if (n) voice(NOTE[n], t, 1.6, 'triangle', g, 500, 0); }
function cello(n, t, g) { if (n) { voice(NOTE[n], t, BEAT * 2.1, 'sawtooth', g, 620, 0); } }

function noiseBurst(t, dur, gainV, hz) {
  if (!AU.ctx || AU.muted) return;
  var len = Math.max(1, Math.floor(AU.ctx.sampleRate * dur));
  var buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (artRng() * 2 - 1) * (1 - i / len);   // 오디오까지 결정론
  var src = AU.ctx.createBufferSource(); src.buffer = buf;
  var f = AU.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = 1.2;
  var g = AU.ctx.createGain(); g.gain.value = gainV;
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(t);
}
function sfxStep() { noiseBurst(auNow(), 0.05, 0.10, sceneDef().low ? 500 : 900); }
function sfxBlip() { voice(660, auNow(), 0.07, 'square', 0.05, 1400, 0); }
function sfxBell() { voice(880, auNow(), 0.7, 'sine', 0.14, 0, 0); voice(1320, auNow(), 0.5, 'sine', 0.07, 0, 3); }
function sfxStamp() {
  if (!AU.ctx || AU.muted) return;
  var t = auNow();
  var o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + 0.25);
  noiseBurst(t, 0.08, 0.2, 700);
}
function sfxDive() {
  if (!AU.ctx || AU.muted) return;
  var t = auNow();
  noiseBurst(t, 0.9, 0.28, 300);
  voice(220, t, 0.9, 'sawtooth', 0.10, 900, 0);
  voice(110, t + 0.1, 0.8, 'sawtooth', 0.08, 400, 0);
}

function humSet(on, warm) {
  if (!AU.ctx) return;
  if (on && !AU.hum) {
    var o1 = AU.ctx.createOscillator(), o2 = AU.ctx.createOscillator(), g = AU.ctx.createGain();
    o1.type = 'sine'; o1.frequency.value = warm ? 90 : 100;
    o2.type = 'sine'; o2.frequency.value = warm ? 135 : 120;
    g.gain.value = 0.018;
    o1.connect(g); o2.connect(g); g.connect(AU.master);
    o1.start(); o2.start();
    AU.hum = { o1: o1, o2: o2, g: g };
  }
  if (!on && AU.hum) {
    try { AU.hum.o1.stop(); AU.hum.o2.stop(); } catch (e) {}
    AU.hum = null;
  }
}

function scheduleBeat(idx, t) {
  var era = G.era;
  var q = idx % 16;                       // position in the 16-quarter loop
  var lead = LEAD[q];
  if (era < 0) {                          // reality frame: faint, sparse
    if (q % 4 === 0) musicbox(lead || 'A4', t, 0.035);
    return;
  }
  if (era === 7.5) {                      // full 47-voice arrangement
    piano(lead, t, 0.16);
    if (lead) musicbox(lead, t, 0.06);                          // doubled octave sparkle
    bassN(q % 4 === 0 ? 'A2' : (q % 4 === 2 ? 'E3' : 0), t, 0.14);
    for (var e8 = 0; e8 < 2; e8++)                              // arpeggio eighths
      piano(ARP[(idx * 2 + e8) % 4], t + e8 * BEAT / 2, 0.05);
    if (q % 2 === 0) cello(COUNTER[(q / 2) % 8], t, 0.05);      // counter line
    if (lead) piano(lead === 'E5' ? 'D5' : 'B4', t + BEAT * 0.12, 0.03);  // grace
    return;
  }
  // era 0 / 4 / 12 ladders
  musicbox(lead, t, 0.11);
  if (era >= 4) bassN(q % 4 === 0 ? 'A2' : (q % 4 === 2 ? 'E3' : 0), t, 0.10);
  if (era >= 12)
    for (var e2 = 0; e2 < 2; e2++)
      piano(ARP[(idx * 2 + e2) % 4], t + e2 * BEAT / 2, 0.045);
}

function audioTick() {
  if (!AU.ctx || AU.muted) return;
  // scene-driven ambient
  var sc = sceneDef();
  humSet(sc.era >= 0 && !sc.corridor, sc.era === 7.5 || sc.era === 12);
  // music scheduler (0.15s lookahead)
  while (AU.nextT < AU.ctx.currentTime + 0.15) {
    scheduleBeat(AU.beat, AU.nextT);
    AU.beat++;
    AU.nextT += BEAT;
  }
  // event SFX (edge-detected from render side; logic untouched)
  if (G.flags._flash !== undefined && G.flags._flash !== AU.lastFlash) {
    AU.lastFlash = G.flags._flash; sfxDive();
  }
  if (G.dialogue) {
    var key = G.dialogue.nodeId + '#' + G.dialogue.stepIdx;
    if (key !== AU.lastSayKey) { AU.lastSayKey = key; sfxBlip(); }
  }
  var bucket = Math.floor((G._walkPhase || 0) / 9);
  if (bucket !== AU.lastStepBucket) { AU.lastStepBucket = bucket; if (bucket > 0) sfxStep(); }
  // era change: soft bell + reset phrase so each memory re-enters the motif
  if (G.era !== AU.lastEra) {
    if (AU.lastEra !== 'x') sfxBell();
    AU.lastEra = G.era;
    AU.beat = 0;
  }
}

addEventListener('keydown', function au1() { auInit(); if (AU.ctx) removeEventListener('keydown', au1); });
addEventListener('mousedown', function au2() { auInit(); if (AU.ctx) removeEventListener('mousedown', au2); });
addEventListener('keydown', function (e) {
  if (e.key === 'm' || e.key === 'M') { AU.muted = !AU.muted; if (AU.muted) humSet(false); }

// ================================================================
// ART — procedural atlas. artRng is SEPARATE from game RNG.
// ================================================================
var artRng = mulberry32(20260827);
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }

var SPR = {};   // name -> canvas

function buildCharacter(name, coat, trim, opts) {
  // 4 dirs x 3 frames, 16x24 each -> canvas 48x96 (col=frame,row=dir DRLU)
  opts = opts || {};
  var c = mk(48, 96), g = c.getContext('2d');
  var dirs = ['D', 'R', 'L', 'U'];
  for (var di = 0; di < 4; di++) {
    for (var f = 0; f < 3; f++) {
      var ox = f * 16, oy = di * 24;
      var bob = f === 1 ? 0 : 1;
      // legs
      var lo = f === 0 ? -2 : (f === 2 ? 2 : 0);
      px(g, ox + 5 + (lo < 0 ? -1 : 0), oy + 19 + bob, 3, 4 - bob, PAL.ink);
      px(g, ox + 9 + (lo > 0 ? 1 : 0), oy + 19 + bob, 3, 4 - bob, PAL.ink);
      // coat/body
      px(g, ox + 4, oy + 10 + bob, 9, 10, coat);
      px(g, ox + 4, oy + 10 + bob, 9, 2, trim);
      // arms
      px(g, ox + 3, oy + 11 + bob + (f === 0 ? 1 : 0), 2, 6, coat);
      px(g, ox + 12, oy + 11 + bob + (f === 2 ? 1 : 0), 2, 6, coat);
      // head
      px(g, ox + 5, oy + 3 + bob, 7, 7, PAL.skin);
      // hair
      px(g, ox + 5, oy + 3 + bob, 7, 2, opts.hair || PAL.ink);
      if (dirs[di] === 'U') px(g, ox + 5, oy + 3 + bob, 7, 6, opts.hair || PAL.ink);
      // eyes
      if (dirs[di] === 'D') { px(g, ox + 6, oy + 6 + bob, 1, 1, PAL.ink); px(g, ox + 10, oy + 6 + bob, 1, 1, PAL.ink); }
      if (dirs[di] === 'R') px(g, ox + 10, oy + 6 + bob, 1, 1, PAL.ink);
      if (dirs[di] === 'L') px(g, ox + 6, oy + 6 + bob, 1, 1, PAL.ink);
      // prop
      if (opts.pad && dirs[di] !== 'U') px(g, ox + 12, oy + 13 + bob, 3, 4, PAL.paper);
      if (opts.sandwich && dirs[di] === 'D' && f === 1) px(g, ox + 2, oy + 14, 3, 2, PAL.amber);
    }
  }
  SPR[name] = c;
}

function buildPenguinSheet(era) {
  var c = mk(48, 96), g = c.getContext('2d');
  for (var di = 0; di < 4; di++) {
    for (var f = 0; f < 3; f++) {
      var ox = f * 16, oy = di * 24;
      var bob = f === 1 ? 0 : 1;
      var waddle = f === 0 ? -1 : (f === 2 ? 1 : 0);
      // feet
      px(g, ox + 4 + waddle, oy + 20, 4, 2, PAL.amber);
      px(g, ox + 9 - waddle, oy + 20, 4, 2, PAL.amber);
      // body
      px(g, ox + 3, oy + 7 + bob, 11, 13, PAL.ink);
      // belly (not on back view)
      if (di !== 3) px(g, ox + 5, oy + 10 + bob, 7, 9, PAL.paper);
      // flippers
      px(g, ox + 2, oy + 10 + bob + (f === 0 ? 1 : 0), 2, 6, PAL.ink);
      px(g, ox + 13, oy + 10 + bob + (f === 2 ? 1 : 0), 2, 6, PAL.ink);
      // head
      px(g, ox + 4, oy + 2 + bob, 9, 7, PAL.ink);
      if (di === 0) { // down: face
        px(g, ox + 6, oy + 4 + bob, 2, 2, PAL.paper); px(g, ox + 10, oy + 4 + bob, 2, 2, PAL.paper);
        px(g, ox + 7, oy + 5 + bob, 1, 1, PAL.ink);  px(g, ox + 10, oy + 5 + bob, 1, 1, PAL.ink);
        px(g, ox + 8, oy + 6 + bob, 2, 2, PAL.amber);
      }
      if (di === 1) { px(g, ox + 10, oy + 4 + bob, 2, 2, PAL.paper); px(g, ox + 12, oy + 6 + bob, 2, 1, PAL.amber); }
      if (di === 2) { px(g, ox + 5, oy + 4 + bob, 2, 2, PAL.paper); px(g, ox + 3, oy + 6 + bob, 2, 1, PAL.amber); }

      // era accessories (Task 6)
      if (era === 4 && di !== 3) {
        // True 명패 목걸이 — 백색 소형 패(약 3×2px) + PAL.ink 테두리 1px (법정 시대)
        px(g, ox + 7, oy + 10 + bob, 3, 1, PAL.ink);
        px(g, ox + 6, oy + 11 + bob, 5, 4, PAL.ink);
        px(g, ox + 7, oy + 12 + bob, 3, 2, PAL.paper);
      } else if (era === 12 && di !== 3) {
        // Gauge Mk.I — PAL.amber 점(2×2px) + 바늘 1px (부착 직후 시대)
        px(g, ox + 6, oy + 11 + bob, 5, 5, PAL.ink);
        px(g, ox + 7, oy + 12 + bob, 3, 3, PAL.amber);
        px(g, ox + 8, oy + 13 + bob, 1, 2, PAL.paper);
      }
    }
  }
  return c;
}

  SPR.penguin_sheet   = buildPenguinSheet(0);

// floor painters
function drawFloor(cx2, sc, camX, camY) {
  var style = sc.floor;
  cx2.fillStyle = sc.tint;
  cx2.fillRect(0, 0, VW, VH);
  var x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE);
  for (var ty = y0; ty <= y0 + Math.ceil(VH / TILE); ty++) {
    for (var tx = x0; tx <= x0 + Math.ceil(VW / TILE); tx++) {
      if (tx < 0 || ty < 0 || tx >= sc.w || ty >= sc.h) continue;
      var sx = tx * TILE - camX, sy = ty * TILE - camY;
      var n = h2(tx, ty * 7 + (sc.era * 13 | 0));
      if (style === 'lino') {
        if ((tx + ty) % 2 === 0) { cx2.fillStyle = 'rgba(16,20,26,0.10)'; cx2.fillRect(sx, sy, TILE, TILE); }
        if (n > 0.93) { cx2.fillStyle = 'rgba(232,226,208,0.06)'; cx2.fillRect(sx + 3, sy + 3, 2, 2); }
      } else if (style === 'wood') {
        cx2.fillStyle = 'rgba(16,20,26,0.12)'; cx2.fillRect(sx, sy + TILE - 2, TILE, 1);
        if (n > 0.85) { cx2.fillStyle = 'rgba(16,20,26,0.15)'; cx2.fillRect(sx + 2, sy + 5, 9, 1); }
      } else if (style === 'terra') {
        if (n > 0.72) { cx2.fillStyle = 'rgba(232,226,208,0.10)'; cx2.fillRect(sx + (n * 11 | 0) % 12, sy + (n * 29 | 0) % 12, 2, 2); }
        if (n < 0.10) { cx2.fillStyle = 'rgba(139,58,46,0.15)'; cx2.fillRect(sx + 6, sy + 8, 2, 2); }
      } else if (style === 'dust') {
        if (n > 0.8) { cx2.fillStyle = 'rgba(16,20,26,0.18)'; cx2.fillRect(sx + (n * 13 | 0) % 13, sy + (n * 31 | 0) % 13, 2, 1); }
      } else {
        if ((tx + ty) % 2 === 0) { cx2.fillStyle = 'rgba(16,20,26,0.07)'; cx2.fillRect(sx, sy, TILE, TILE); }
      }
      // memory-edge dithering (unfinished recollection)
      var edge = Math.min(tx, ty, sc.w - 1 - tx, sc.h - 1 - ty);
      if (edge <= 2 && sc.era >= 0) {
        var th = edge === 0 ? 0.15 : (edge === 1 ? 0.55 : 0.8);
        if (h2(tx * 3 + 1, ty * 5 + 2) > th) {
          cx2.fillStyle = PAL.shadow;
          if ((tx + ty) % 2 === 0) cx2.fillRect(sx, sy, TILE, TILE);
          else { cx2.fillRect(sx, sy, 8, 8); cx2.fillRect(sx + 8, sy + 8, 8, 8); }
        }
      }
    }
  }
}

function render() {
  var sc = sceneDef();
  var rm = !!G.flags.reducedMotion;

  if (G._title) {
    if (sc.doc) docScreen(sc.doc);
    dialogueBox();
    drawTitle();
    return;
  }

  if (sc.doc && !G.dialogue) { docScreen(sc.doc); drawSaveMenu(); drawTouchControls(); return; }
  if (sc.doc) { docScreen(sc.doc); dialogueBox(); drawSaveMenu(); drawTouchControls(); return; }

  var camX = Math.max(0, Math.min(G.pos.x - VW / 2, sc.w * TILE - VW));
  var camY = Math.max(0, Math.min(G.pos.y - VH / 2, sc.h * TILE - VH));
  if (sc.h * TILE < VH) camY = -(VH - sc.h * TILE) / 2;

  drawFloor(cxm, sc, camX, camY);

  // walls (top strip)
  cxm.fillStyle = 'rgba(16,20,26,0.55)';
  cxm.fillRect(0, 0 - camY, sc.w * TILE, TILE * 1.2);

  // deco behind
  var deco = sc.deco || [];
  for (var i = 0; i < deco.length; i++) {
    var d = deco[i];
    var s = SPR[d[0]];
    if (!s) continue;
    var dx2 = d[1] * TILE - camX, dy2 = d[2] * TILE - camY;
    if (d[0] === 'fluo') {
      cxm.drawImage(s, dx2 - 15, dy2 + 2);
      // flicker: pure fn of frame+index
      if (!rm && h2(G.frame >> 3, i * 17) > 0.94) {
        cxm.fillStyle = 'rgba(201,201,122,0.25)';
        cxm.fillRect(dx2 - 13, dy2 + 5, 26, 2);
      }
    } else if (d[0] === 'beam') {
      cxm.drawImage(s, dx2 - 10, dy2);
    } else {
      cxm.drawImage(s, dx2 - s.width / 2, dy2 - s.height + 10);
    }
  }

  // objects + player, depth-sorted
  var drawables = [];
  for (var oi = 0; oi < sc.objects.length; oi++) {
    var o = sc.objects[oi];
    drawables.push({ y: o.y * TILE, obj: o });
  }
  drawables.push({ y: G.pos.y, player: true });
  drawables.sort(function (a, b) { return a.y - b.y; });

  for (var di2 = 0; di2 < drawables.length; di2++) {
    var it = drawables[di2];
    if (it.player) {
      charFrame(SPR[(G.player && G.player.spr || 'penguin4') + '_sheet'] || SPR.penguin_sheet,
                G.facing, G._walkPhase || 0, G.pos.x - camX, G.pos.y - camY, !!sc.low);
      continue;
    }
    var o2 = it.obj;
    var ox = o2.x * TILE - camX, oy = o2.y * TILE - camY;
    if (o2.spr && o2.spr.indexOf('penguin') === 0) {
      var pf = rm ? 1 : (Math.floor(G.frame / 24) % 2 === 0 ? 0 : 2);
      var psheet = SPR[o2.spr + '_sheet'] || SPR.penguin_sheet;
      cxm.drawImage(psheet, pf * 16, 0, 16, 24, Math.round(ox - 8), Math.round(oy - 20), 16, 24);
    } else if (o2.spr) {
      drawSprite(o2.spr, ox, oy + 4);
    }
    // states
    if (o2.kind === 'bank' && !G.bankGiven[o2.id]) {
      var bobY = rm ? 0 : Math.sin(G.frame / 14 + o2.x) * 2;
      cxm.fillStyle = PAL.fluoro;
      cxm.fillRect(ox - 1, oy - 26 + bobY, 3, 3);
    }
    if (o2.kind === 'bank' && G.bankGiven[o2.id]) {
      cxm.fillStyle = 'rgba(201,201,122,0.55)';
      cxm.fillRect(ox - 2, oy - 24, 5, 2);
    }
    if (o2.kind === 'memento' && G.mementos.indexOf(o2.mem) < 0) {
      // protective orb
      var pulse = rm ? 0 : Math.sin(G.frame / 10) * 2;
      cxm.globalAlpha = 0.75;
      cxm.drawImage(SPR.orb, ox - 8 - pulse / 2, oy - 22 - pulse / 2, 16 + pulse, 16 + pulse);
      cxm.globalAlpha = 1;
    }
  }

  // low ceiling overlay (7½F)
  if (sc.low) {
    cxm.fillStyle = PAL.shadow;
    cxm.fillRect(0, 0, VW, 30);
    for (var bi = 0; bi < 10; bi++) cxm.drawImage(SPR.beam, bi * 52 - (camX % 52), 26);
    cxm.fillRect(0, VH - 16, VW, 16);
  }

  // dust motes in memory light (render-only, pure fn of frame)
  if (!rm && sc.era >= 0 && !sc.corridor) {
    cxm.fillStyle = 'rgba(232,226,208,0.35)';
    for (var mi = 0; mi < 36; mi++) {
      var t = (G.frame + mi * 97) % 480;
      var mx2 = ((h2(mi, 11) * sc.w * TILE) + t * 0.12) % (sc.w * TILE) - camX;
      var my2 = (h2(mi, 29) * sc.h * TILE + Math.sin((G.frame + mi * 40) / 90) * 6) - camY;
      if (mx2 > -2 && mx2 < VW && my2 > -2 && my2 < VH) cxm.fillRect(mx2, my2, 1, 1);
    }
  }

  // ---- lighting pass ----
  var amb = sc.ambient === undefined ? 0.5 : sc.ambient;
  lightCx.clearRect(0, 0, VW, VH);
  lightCx.fillStyle = 'rgba(16,20,26,' + amb + ')';
  lightCx.fillRect(0, 0, VW, VH);
  lightCx.globalCompositeOperation = 'destination-out';
  var lights = sc.lights || [];
  for (var li = 0; li < lights.length; li++) {
    var L = lights[li];
    var lx = L.x * TILE - camX, ly = L.y * TILE - camY;
    var gr = lightCx.createRadialGradient(lx, ly, 4, lx, ly, L.r);
    gr.addColorStop(0, 'rgba(0,0,0,0.9)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    lightCx.fillStyle = gr;
    lightCx.fillRect(lx - L.r, ly - L.r, L.r * 2, L.r * 2);
  }
  // player lamp
  var pgr = lightCx.createRadialGradient(G.pos.x - camX, G.pos.y - camY - 6, 2, G.pos.x - camX, G.pos.y - camY - 6, 48);
  pgr.addColorStop(0, 'rgba(0,0,0,0.8)'); pgr.addColorStop(1, 'rgba(0,0,0,0)');
  lightCx.fillStyle = pgr;
  lightCx.fillRect(G.pos.x - camX - 48, G.pos.y - camY - 54, 96, 96);
  lightCx.globalCompositeOperation = 'source-over';
  cxm.drawImage(lightCv, 0, 0);
  // warm glows (screen-ish)
  cxm.globalCompositeOperation = 'lighter';
  for (var li2 = 0; li2 < lights.length; li2++) {
    var L2 = lights[li2];
    var lx2 = L2.x * TILE - camX, ly2 = L2.y * TILE - camY;
    var gr2 = cxm.createRadialGradient(lx2, ly2, 2, lx2, ly2, L2.r * 0.8);
    gr2.addColorStop(0, L2.c);
    gr2.addColorStop(1, 'rgba(0,0,0,0)');
    cxm.fillStyle = gr2;
    cxm.fillRect(lx2 - L2.r, ly2 - L2.r, L2.r * 2, L2.r * 2);
  }
  cxm.globalCompositeOperation = 'source-over';

  // corridor HUD
  if (sc.corridor) {
    corridorArt(camX);
  }

  // film grain
  if (!rm) {
    var gx2 = (G.frame * 37) % 48, gy2 = (G.frame * 61) % 48;
    cxm.globalAlpha = 0.5;
    for (var gi = -1; gi < Math.ceil(VW / 96) + 1; gi++)
      for (var gj = -1; gj < Math.ceil(VH / 96) + 1; gj++)
        cxm.drawImage(GRAIN, gi * 96 - gx2, gj * 96 - gy2);
    cxm.globalAlpha = 1;
  }

  // flash
  if (G.flags._flash !== undefined) {
    var dt = G.frame - G.flags._flash;
    if (dt < 18) {
      cxm.fillStyle = 'rgba(232,226,208,' + (rm ? 0.25 : (1 - dt / 18)) + ')';
      cxm.fillRect(0, 0, VW, VH);
    }
  }

  // mem4 flashback tone shift (기억의 잔광) (W5)
  if (G.scene === 'mem4') {
    var rm4 = !!(G.flags && G.flags.reducedMotion);
    cxm.fillStyle = 'rgba(217, 160, 91, 0.12)';
    cxm.fillRect(0, 0, VW, VH);
    var grad4 = cxm.createRadialGradient(VW / 2, VH / 2, 50, VW / 2, VH / 2, rm4 ? 200 : 210 + Math.sin(G.frame / 20) * 8);
    grad4.addColorStop(0, 'rgba(217, 160, 91, 0)');
    grad4.addColorStop(1, 'rgba(139, 58, 46, 0.20)');
    cxm.fillStyle = grad4;
    cxm.fillRect(0, 0, VW, VH);
  }

  hud(sc);
  if (G.puzzle && G.puzzle.active) puzzleArt();
  dialogueBox();
  drawSaveMenu();
  drawTouchControls();
}

    cxm.strokeStyle = PAL.amber;
    cxm.strokeRect(VW - 46, VH - 46, 36, 36);
    cxm.fillStyle = PAL.amber;
    cxm.font = '10px monospace';
    cxm.fillText('[E]', VW - 36, VH - 24);

    cxm.globalAlpha = 1.0;
  }
}

function corridorArt(camX) {
  // corridor: perspective strip + HUD gauge
  var vAvg = 0;
  for (var v = 0; v < G.vHist.length; v++) vAvg += G.vHist[v];
  vAvg = (vAvg / (G.vHist.length || 1)) * 60;
  var rm = !!(G.flags && G.flags.reducedMotion);

  // door frames & light pools along the corridor (W4)
  for (var dx3 = 0; dx3 < 16; dx3++) {
    var wx = dx3 * 64 - (camX % 64);
    cxm.fillStyle = 'rgba(110,123,139,0.25)';
    cxm.fillRect(wx, 30, 3, VH - 90);

    // ceiling lantern
    cxm.fillStyle = PAL.amber;
    cxm.fillRect(wx - 3, 26, 9, 4);

    // floor light pool (케이다린 수정 배열)
    var poolX = wx + 1, poolY = VH - 36;
    var pulse = rm ? 0 : Math.sin(G.frame / 16 + dx3) * 2;
    var grad = cxm.createRadialGradient(poolX, poolY, 2, poolX, poolY, 24 + pulse);
    grad.addColorStop(0, 'rgba(217, 160, 91, 0.40)');
    grad.addColorStop(0.5, 'rgba(127, 212, 168, 0.12)');
    grad.addColorStop(1, 'rgba(16, 20, 26, 0)');
    cxm.fillStyle = grad;
    cxm.fillRect(poolX - 32, poolY - 16, 64, 32);
  }
  cxm.fillStyle = 'rgba(16,20,26,0.85)'; cxm.fillRect(8, 8, 210, 30);
  cxm.strokeStyle = PAL.olive; cxm.strokeRect(8, 8, 210, 30);
  var frac = Math.min(1, vAvg / 400);
  cxm.fillStyle = vAvg > 227 ? PAL.red : PAL.crt;
  cxm.fillRect(11, 11, 204 * frac, 9);
  cxm.strokeStyle = PAL.paper;
  cxm.beginPath(); cxm.moveTo(11 + 227 / 400 * 204, 9); cxm.lineTo(11 + 227 / 400 * 204, 38); cxm.stroke();
  cxm.fillStyle = PAL.paper; cxm.font = '8px monospace';
  cxm.fillText('보행속도 ' + vAvg.toFixed(0) + ' px/s   임계 227', 13, 33);
  var c = G.corridor || {};
  if (c.gag === 1) { cxm.fillStyle = PAL.fluoro; cxm.fillText('신입: 뛰지 말라니까요!', 13, 48); }
  if (c.gag === 2) { cxm.fillStyle = PAL.fluoro; cxm.fillText('신입: 걷기. 걷-기.', 13, 48); }
  if (c.gag === 3) { cxm.fillStyle = PAL.fluoro; cxm.fillText('신입: …선배님도 옛날에 뛰어봤죠.', 13, 48); }
}

function hud(sc) {
  // era stamp
  cxm.fillStyle = 'rgba(232,226,208,0.9)';
  cxm.fillRect(VW - 86, 6, 80, 20);
  cxm.strokeStyle = PAL.rust; cxm.strokeRect(VW - 86, 6, 80, 20);
  cxm.fillStyle = PAL.rust; cxm.font = '9px monospace';
  var eraLabel = G.era < 0 ? 'B-207' : (G.era === 7.5 ? '좌표 이탈' : '각주 ' + G.era);
  cxm.fillText(eraLabel, VW - 80, 19);
  // banks
  var mem = G.scene.indexOf('mem') === 0 && G.banks[G.scene] !== undefined ? G.scene : null;
  if (mem) {
    for (var i = 0; i < 5; i++) {
      cxm.fillStyle = i < G.banks[mem] ? PAL.gold : 'rgba(232,226,208,0.25)';
      cxm.fillRect(VW - 84 + i * 15, 30, 11, 5);
    }
  }
}

function puzzleArt() {
  cxm.fillStyle = 'rgba(16,20,26,0.92)'; cxm.fillRect(86, 36, 308, 178);
  cxm.strokeStyle = PAL.olive; cxm.strokeRect(86, 36, 308, 178);
  cxm.fillStyle = PAL.fluoro; cxm.font = '9px monospace';
  cxm.fillText('도장 정렬 — 전부 앞면으로 (클릭: 십자 반전)', 100, 52);
  for (var pi = 0; pi < 15; pi++) {
    var px2 = 110 + (pi % 5) * 54, py2 = 62 + Math.floor(pi / 5) * 44;
    var flipped = G.puzzle.grid[pi];
    cxm.fillStyle = flipped ? PAL.rust : PAL.paper;
    cxm.fillRect(px2, py2, 46, 36);
    cxm.strokeStyle = PAL.ink; cxm.strokeRect(px2, py2, 46, 36);
    if (flipped) {
      cxm.fillStyle = PAL.paper; cxm.font = '8px monospace';
      cxm.fillText('반려', px2 + 13, py2 + 21);
    } else {
      cxm.fillStyle = PAL.olive; cxm.font = '7px monospace';
      cxm.fillText('원본', px2 + 15, py2 + 21);
    }
  }
}

var PORTRAIT = { kkos: null, newbie: null, archon: null, sys: null };
function buildPortraits() {
  function bust(draw) {
    var c = mk(28, 28), g = c.getContext('2d');
    px(g, 0, 0, 28, 28, PAL.shadow);
    draw(g);
    return c;
  }
  PORTRAIT.kkos = bust(function (g) {
    px(g, 6, 6, 16, 14, PAL.skin); px(g, 6, 4, 16, 5, PAL.steel);
    px(g, 9, 12, 2, 2, PAL.ink); px(g, 17, 12, 2, 2, PAL.ink);
    px(g, 4, 20, 20, 8, PAL.ink);
  });
  PORTRAIT.newbie = bust(function (g) {
    px(g, 6, 6, 16, 14, PAL.skin); px(g, 6, 4, 16, 4, PAL.ink);
    px(g, 9, 12, 2, 2, PAL.ink); px(g, 17, 12, 2, 2, PAL.ink);
    px(g, 12, 16, 4, 1, PAL.rust);
    px(g, 4, 20, 20, 8, PAL.olive);
  });
  PORTRAIT.archon = bust(function (g) {
    px(g, 5, 4, 18, 20, PAL.ink); px(g, 8, 10, 12, 12, PAL.paper);
    px(g, 9, 8, 3, 3, PAL.paper); px(g, 16, 8, 3, 3, PAL.paper);
    px(g, 10, 9, 1, 1, PAL.ink); px(g, 17, 9, 1, 1, PAL.ink);
    px(g, 12, 11, 4, 3, PAL.amber);
  });
  PORTRAIT.sys = bust(function (g) {
    px(g, 5, 6, 18, 14, PAL.teal); px(g, 7, 8, 14, 2, PAL.crt);
    px(g, 7, 12, 10, 1, PAL.crt); px(g, 7, 15, 12, 1, PAL.crt);
  });
  PORTRAIT.insp = bust(function (g) {
    px(g, 6, 6, 16, 14, PAL.skin); px(g, 6, 4, 16, 4, PAL.ink);
    px(g, 9, 12, 2, 2, PAL.ink); px(g, 17, 12, 2, 2, PAL.ink);
    px(g, 4, 20, 20, 8, PAL.olive);
  });
}
buildPortraits();
var WHO = { kkos: '클코스', newbie: '신입', archon: 'ARCHON', sys: 'SYSTEM', insp: '검침원' };

function dialogueBox() {
  G._drawn = null; G._drawnChoices = null;
  if (!G.dialogue) return;
  var node = SCRIPT.nodes[G.dialogue.nodeId];
  if (!node) return;
  // last PROCESSED step is stepIdx-1; scanning from stepIdx leaked the next line
  var idx = Math.min(G.dialogue.stepIdx - 1, node.steps.length - 1);
  var opD = null;
  for (var b = idx; b >= 0; b--) if (node.steps[b] && node.steps[b].say) { opD = node.steps[b]; break; }
  if (!opD) return;
  var who = opD.say[0], text = opD.say[1];
  cxm.fillStyle = 'rgba(16,20,26,0.93)';
  cxm.fillRect(6, VH - 70, VW - 12, 64);
  cxm.strokeStyle = PAL.olive; cxm.strokeRect(6, VH - 70, VW - 12, 64);
  var pc = PORTRAIT[who];
  if (pc) { cxm.drawImage(pc, 12, VH - 62); cxm.strokeStyle = PAL.steel; cxm.strokeRect(12, VH - 62, 28, 28); }
  cxm.fillStyle = PAL.fluoro; cxm.font = '9px monospace';
  cxm.fillText(WHO[who] || who, 48, VH - 56);
  // typewriter reveal from hold countdown (render-only; pauses show full text)
  var frac = 1;
  if (!G.ffMode && G.dialogue.waiting && G.dialogue.hold > 0)
    frac = Math.max(0, Math.min(1, (24 - G.dialogue.hold) / 16));
  var shown = text.slice(0, Math.ceil(text.length * frac));
  G._drawn = { who: who, text: text, shown: shown };
  cxm.fillStyle = PAL.paper; cxm.font = '10px monospace';
  cxm.fillText(shown.slice(0, 50), 48, VH - 40);
  if (shown.length > 50) cxm.fillText(shown.slice(50, 100), 48, VH - 26);
  if (G.dialogue.choosing) {
    var chr = G.dialogue.choosing, cnr = chr.opts.length;
    var bh = cnr * 16 + 10, bw = 224, bx = VW - bw - 10, by = VH - 76 - bh;
    cxm.fillStyle = 'rgba(16,20,26,0.95)'; cxm.fillRect(bx, by, bw, bh);
    cxm.strokeStyle = PAL.amber; cxm.strokeRect(bx, by, bw, bh);
    for (var ci = 0; ci < cnr; ci++) {
      var oy = by + 8 + ci * 16;
      if (ci === chr.sel) {
        cxm.fillStyle = PAL.amber; cxm.fillRect(bx + 4, oy - 2, bw - 8, 14);
        cxm.fillStyle = PAL.ink;
      } else cxm.fillStyle = PAL.paper;
      cxm.font = '9px monospace';
      cxm.fillText(chr.opts[ci][0].slice(0, 24), bx + 10, oy + 8);
    }
    G._drawnChoices = { sel: chr.sel,
                        labels: chr.opts.map(function (o) { return o[0]; }) };
    cxm.fillStyle = PAL.olive; cxm.font = '7px monospace';
    cxm.fillText('[▲▼ 선택 · E 확정]', VW - 100, VH - 12);
  } else {
    cxm.fillStyle = PAL.olive; cxm.font = '7px monospace';
    cxm.fillText('[E/Space/클릭]', VW - 78, VH - 12);
  }
}

var STEP_MS = 1000 / 60, MAX_CATCH = 5;
var accMs = 0, lastNow = -1;
function loop(now) {
  // accumulate real time; step simulation at a fixed 1/60s regardless of refresh
  if (lastNow < 0) lastNow = now;
  accMs += now - lastNow; lastNow = now;
  if (accMs > STEP_MS * MAX_CATCH) accMs = STEP_MS * MAX_CATCH;
  var ran = 0;
  while (accMs >= STEP_MS && ran < MAX_CATCH) { update(); accMs -= STEP_MS; ran++; }
  render();
  audioTick();
  fpsCount++;
  if (now - fpsWindowStart >= 1000) {
    fpsValue = fpsCount * 1000 / (now - fpsWindowStart);
    fpsCount = 0; fpsWindowStart = now;
  }
  requestAnimationFrame(loop);
}

// fit canvas to window (integer-ish scale, letterboxed by flex centering)
function fit() {
  var s = Math.max(1, Math.min(innerWidth / VW, innerHeight / VH));
  if (s > 2) s = Math.floor(s);
  cv.style.width = (VW * s) + 'px';
  cv.style.height = (VH * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------------- debug contract (design.md §6) ----------------
function skipTitleAndModals() {
  if (G._title) G._title = false;
  if (G._saveMenu) G._saveMenu = false;
}

window.__game = G;
G.api = {
  step: function (n) { skipTitleAndModals(); for (var i = 0; i < n; i++) update(); },
  setSeed: setSeed,
  hash: stateHash,
  teleport: function (scene, x, y) {
    skipTitleAndModals();
    G.dialogue = null; G.inputQ = []; G.puzzle = null;
    enterScene(scene, x, y);
  },
  input: function (op) { skipTitleAndModals(); G.inputQ.push(op); },
  ff: function (b) { skipTitleAndModals(); G.ffMode = !!b; },
  save: saveSlot,
  load: function (n) {
    skipTitleAndModals();
    var r = loadSlot(n);
    // resync render-side audio edge detectors so loading is silent
    AU.lastFlash = G.flags._flash !== undefined ? G.flags._flash : -1;
    AU.lastEra = G.era;
    return r;
  },
  solvePuzzle: function () { skipTitleAndModals(); return solvePuzzleNow(); },
  autoplay: function (maxFrames) { skipTitleAndModals(); return autoplay(maxFrames); },
  fps: function () { return fpsValue; },
  grantBank: function (mem) { if (G.banks[mem] < 5) G.banks[mem]++; },
  interactWith: function (id) { skipTitleAndModals(); var o = findObject(id); if (o) interactObject(o); },
  canDive: function (id) { return G.mementos.indexOf(String(id).split('_')[0]) >= 0; },
  resetCorridor: resetCorridor,
  hud: function () {
    return { gauge: G._gauge, gaugeRect: [VW - 130, 30, 122, 16],
             stamps: (G.flags.stamps !== undefined ? G.flags.stamps : 1896) };
  },
  trial: function () {
    var rates = [];
    if (G.flags.r1_rated) rates.push(12.5);
    if (G.flags.r2_rated) rates.push(8.33);
    if (G.flags.r3_rated) rates.push(0.0);
    return { round: G.flags.round || 0, phase: G.flags.phase || 'arrive',
             testimony: TESTIMONY_JS[G.flags.round] || null, rates: rates,
             lastStamp: G._lastStamp || null, lastEvent: G._lastEvent || null };
  },
  advance: function () { skipTitleAndModals(); advanceDialogue(); },
  choose: function (i) { skipTitleAndModals(); chooseOption(i); },
  gotoRound: function (r) {
    skipTitleAndModals();
    G.dialogue = null; G.inputQ = [];
    setRoundState(r);
  },
  enterRecollection: function (r) {
    skipTitleAndModals();
    G.dialogue = null;
    G.flags.round = r;
    G.flags.phase = 'recall';
    startDialogue('re' + r + '.enter');
  },
  finishRecollection: function () {
    skipTitleAndModals();
    var r = G.flags.round;
    var spots = SPOTS[r] || [];
    for (var i = 0; i < spots.length; i++) G.flags[spots[i]] = true;
    if (r === 1) G.flags.mail_visits = 3;
    G.dialogue = null;
    G.flags.phase = 'rating';
    startDialogue('r' + r + '.rate');
    return true;
  },
  gotoVerdict: function () {
    skipTitleAndModals();
    G.dialogue = null; G.inputQ = [];
    setRoundState(3);
    var spots = SPOTS[3];
    for (var i = 0; i < spots.length; i++) G.flags[spots[i]] = true;
    G.flags.r3_rated = true;
    G.flags.stamps = 1900;
    G.flags.phase = 'rating';
    G.dialogue = null;
    startDialogue('court.verdict');
  },
  summonToBench: function () {
    skipTitleAndModals();
    G.flags.summon = 'witness_stand';
    G._idleF = 0;
  },
  sceneObjects: function () {   // 읽기 전용 스냅샷 (콘텐츠 2차, N13/N14)
    return sceneDef().objects.map(function (o) {
      return { id: o.id, kind: o.kind, spr: o.spr || null, x: o.x, y: o.y,
               node: o.node || null, node2: o.node2 || null, mem: o.mem || null };
    });
  },
  sprData: function (name) { return SPR[name] ? SPR[name].toDataURL() : null; },
  toggleSaveMenu: function (b) { G._saveMenu = b !== undefined ? !!b : !G._saveMenu; },
  uiSave: function (n) { return saveSlot(n); },
  uiLoad: function (n) { return loadSlot(n); },
  corridorLights: function () { return sceneDef().corridor ? [1, 2, 3, 4] : []; },
  sceneTone: function () { return G.scene === 'mem4' ? 'mem4_flashback' : null; },
  credits: function () { startDialogue('credits.start'); },
  touchInput: function (opts) {
    skipTitleAndModals();
    if (opts.right !== undefined) live.right = opts.right;
    if (opts.left !== undefined) live.left = opts.left;
    if (opts.up !== undefined) live.up = opts.up;
    if (opts.down !== undefined) live.down = opts.down;
    if (opts.run !== undefined) live.run = opts.run;
  },
  touchChoice: function (idx) { skipTitleAndModals(); chooseOption(idx); },
};

// reduced motion
try {
  G.flags.reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
} catch (e) { G.flags.reducedMotion = false; }

// boot
enterScene('lobby', 3, 5);
requestAnimationFrame(loop);

})();
</script>
