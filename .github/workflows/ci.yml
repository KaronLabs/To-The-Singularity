name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: playwright install --with-deps chromium
      - run: python -B test_episode1.py
      - run: python -B test_episode2.py
      - run: python -B test_episode3.py
      - run: python -B test_index.py
      - run: python -B test_extra_escaflone.py
